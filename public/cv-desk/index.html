function foldCv(value) {
  return String(value || "").toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, "");
}

function citedCv(value, sourceFold) {
  const text = String(value || "").replace(/\s+/g, " ").trim();
  const folded = foldCv(text);
  if (folded.length < 2 || !sourceFold.includes(folded)) return "";
  return text;
}

function citedParts(value, sourceFold) {
  return String(value || "").split(/[,，、;/|]+/).map((part) => citedCv(part, sourceFold)).filter(Boolean);
}

function preferSplit(current, incoming) {
  const kept = (current || []).map((item) => String(item || "").trim()).filter(Boolean);
  if (!kept.length || kept.length <= incoming.length) return incoming;
  const joined = foldCv(incoming.join(" "));
  return kept.every((item) => joined.includes(foldCv(item))) ? kept : incoming;
}

function applyAiCv(local, ai, source) {
  const sourceFold = foldCv(source);
  const cite = (value) => citedCv(value, sourceFold);
  const name = cite(ai.candidate);
  if (name) local.candidate = name;
  const languages = citedParts(ai.languages, sourceFold);
  if (languages.length) local.languages = languages.join(", ");
  const skills = preferSplit(local.skills, (Array.isArray(ai.skills) ? ai.skills : []).map((item) => cite(item)).filter(Boolean));
  if (skills.length) local.skills = pad(skills, 7);
  ["recentSalary", "expectedSalary", "notice"].forEach((key) => {
    const value = cite(ai[key]);
    if (value) local[key] = value;
  });
  const education = ai.education && typeof ai.education === "object" ? ai.education : {};
  const eduDates = cite(education.dates);
  if (eduDates) local.eduLeft = eduDates;
  const eduLines = preferSplit(local.edu, (Array.isArray(education.lines) ? education.lines : []).map((item) => cite(item)).filter(Boolean));
  if (eduLines.length) local.edu = pad(eduLines, 4);
  const certs = preferSplit(local.certs, (Array.isArray(ai.certs) ? ai.certs : []).map((item) => cite(item)).filter(Boolean));
  if (certs.length) local.certs = pad(certs, 2);
  const project = preferSplit(local.project, (Array.isArray(ai.project) ? ai.project : []).map((item) => cite(item)).filter(Boolean));
  if (project.length) local.project = pad(project, 5);
  const jobs = (Array.isArray(ai.jobs) ? ai.jobs : []).map((job, index) => {
    const slot = index === 0 ? local.duty1 : local.duty2;
    const duties = preferSplit(slot, (Array.isArray(job && job.duties) ? job.duties : []).map((item) => cite(item)).filter(Boolean));
    return {
      company: cite(job && job.company),
      role: cite(job && job.role),
      dates: cite(job && job.dates),
      duties: duties
    };
  }).filter((job) => job.company || job.role || job.dates);
  if (jobs[0]) {
    local.job1 = [jobs[0].company, jobs[0].role, jobs[0].dates];
    if (jobs[0].duties.length) local.duty1 = pad(jobs[0].duties, 6);
  }
  if (jobs[1]) {
    local.job2 = [jobs[1].company, jobs[1].role, jobs[1].dates];
    if (jobs[1].duties.length) local.duty2 = pad(jobs[1].duties, 5);
  }
  return local;
}

async function askCvAi(text) {
  const source = String(text || "").slice(0, 14000);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 25000);
  try {
    const response = await fetch("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        model: "openai",
        messages: [{
          role: "user",
          content: "You place text from a CV into fields. Copy words exactly from the CV. Do not invent, translate, or summarise. Dates stay with the job or course they belong to. A date is never a job title. Return JSON only with this shape: {\"candidate\":\"\",\"languages\":\"\",\"skills\":[],\"recentSalary\":\"\",\"expectedSalary\":\"\",\"notice\":\"\",\"education\":{\"dates\":\"\",\"lines\":[]},\"certs\":[],\"project\":[],\"jobs\":[{\"company\":\"\",\"role\":\"\",\"dates\":\"\",\"duties\":[]}]}. skills, certs, project, education.lines, and duties are arrays of short copied lines. jobs are newest first, at most 4.\n\nCV:\n" + source
        }]
      })
    });
    if (!response.ok) return null;
    const payload = await response.json();
    const content = payload && payload.choices && payload.choices[0] && payload.choices[0].message && payload.choices[0].message.content;
    const raw = String(content || "").replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
    const start = raw.indexOf("{");
    const end = raw.lastIndexOf("}");
    if (start < 0 || end <= start) return null;
    return JSON.parse(raw.slice(start, end + 1));
  } catch (error) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function show(text, options) {
  let data;
  try {
    data = parseCv(text);
  } catch (error) {
    document.getElementById("status").textContent = "This CV could not be read. Try a PDF or Word file that has selectable text.";
    return;
  }
  const useAi = !(options && options.ai === false);
  if (useAi) {
    document.getElementById("status").textContent = "Checking each field with AI…";
    const ai = await askCvAi(text);
    if (ai) data = applyAiCv(data, ai, text);
    else useAi && (options = { failed: true });
  }
  editingId = null;
  editingSample = false;
  sheetDirty = false;
  render(data);
  document.getElementById("file-name").value = data.candidate ? "HR Plus CV - " + data.candidate : "HR Plus CV";
  const found = sectionFill(data);
  const note = !useAi ? "" : (options && options.failed ? " • AI was busy, so the document reader filled the fields" : " • AI checked the fields against the CV");
  document.getElementById("status").textContent = "CV Uploaded Successfully • " + found.filled + " section" + (found.filled === 1 ? "" : "s") + " auto-filled, " + found.empty + " section" + (found.empty === 1 ? "" : "s") + " empty" + note;
}

function sectionFill(data) {
  const sections = [
    !!(data.languages || linesOf(data.skills).length || data.recentSalary || data.expectedSalary || data.notice),
    !!(data.eduLeft || (data.edu || []).some(Boolean)),
    (data.certs || []).some((item) => String(item || "").trim()),
    linesOf(data.project).length > 0,
    !!((data.job1 || []).some(Boolean) || (data.duty1 || []).some(Boolean))
  ];
  const filled = sections.filter(Boolean).length;
  return { filled: filled, empty: sections.length - filled };
}

let mailLocked = false;
let mailDraftId = "";
let mailFileId = "";
let draftView = "DRAFT";
let mailPicked = [];
let mailTouched = false;

function mailPool() {
  const rows = loadAll().map((row) => Object.assign({}, row));
  if (document.querySelector("#sheet-wrap .sheet")) {
    const open = readSheet();
    open.id = editingId || "open-sheet";
    open.fileName = chosenFileName(open);
    const index = rows.findIndex((row) => row.id === open.id);
    if (index >= 0) rows[index] = Object.assign({}, rows[index], open);
    else rows.unshift(open);
  }
  mailPicked.forEach((item) => {
    if (item.cv && !rows.some((row) => row.id === item.id)) rows.push(item.cv);
  });
  return rows;
}

function rowSearchText(row) {
  const jobs = (row.more && row.more.jobs) || [];
  const titles = jobs.map((job) => [job.role, job.company, job.dates].filter(Boolean).join(" ")).join(" ");
  return [row.candidate, row.fileName, row.date, row.languages, linesOf(row.skills).join(" "), titles, (row.job1 || []).join(" "), linesOf(row.project).join(" ")].join(" ").toLowerCase();
}

function experienceYears(dates) {
  const text = String(dates || "");
  const years = text.match(/\d{4}/g);
  if (!years || !years.length) return "";
  const start = Number(years[0]);
  const ongoing = /present|current|now|to date/i.test(text);
  const end = ongoing || years.length === 1 ? new Date().getFullYear() : Number(years[years.length - 1]);
  const span = end - start;
  return span > 0 ? String(span) : "";
}

function currentRole(row) {
  const jobs = (row.more && row.more.jobs) || [];
  const first = jobs[0] || {};
  const role = first.role || (row.job1 && row.job1[1]) || "";
  const company = first.company || (row.job1 && row.job1[0]) || "";
  const dates = first.dates || (row.job1 && row.job1[2]) || "";
  const years = experienceYears(dates);
  const place = [role || "Not stated", company ? "at " + company : ""].filter(Boolean).join(" ");
  return place + (years ? " (" + years + " years)" : "");
}

function keyStrengths(row) {
  const skills = linesOf(row.skills).slice(0, 4).join(", ");
  const project = linesOf(row.project).find(Boolean);
  const certs = (row.more && row.more.certs) || row.certs || [];
  const cert = certs.map((item) => String(item || "").trim()).find(Boolean);
  return [skills || row.languages, project || cert].filter(Boolean).join(". ") || "Not stated";
}

function attachmentName(item) {
  const cv = item.cv || {};
  const base = cleanFileName(cv.fileName, cv.candidate ? "HR Plus CV - " + cv.candidate : "HR Plus CV");
  return base + (item.format === "docx" ? ".docx" : ".pdf");
}

function mailSubject() {
  const names = mailPicked.map((item) => (item.cv && item.cv.candidate) || "").map((name) => name.trim()).filter(Boolean);
  const company = document.getElementById("mail-company").value.trim();
  const who = names.join(", ");
  const tail = [who, company].filter(Boolean).join(" — ");
  return "[HR Plus] Candidate Recommendation" + (tail ? ": " + tail : "");
}

function mailHtml() {
  const company = document.getElementById("mail-company").value.trim() || "your company";
  const position = document.getElementById("mail-position").value.trim();
  const rolePhrase = position
    ? "the <strong>" + esc(position) + "</strong> role"
    : "your open role";
  const blocks = mailPicked.map((item, index) => {
    const cv = item.cv || {};
    const name = esc(cv.candidate || "Candidate");
    const notice = esc(cv.notice || "Not stated");
    const salary = esc(cv.expectedSalary || "Not stated");
    return "<p><strong>Candidate " + (index + 1) + ": " + name + "</strong></p><ul>"
      + "<li><strong>Current Role:</strong> " + esc(currentRole(cv)) + "</li>"
      + "<li><strong>Key Strengths &amp; Achievements:</strong> " + esc(keyStrengths(cv)) + "</li>"
      + "<li><strong>Notice Period &amp; Expected Salary:</strong> " + notice + " | " + salary + "</li>"
      + "<li><strong>Attachment:</strong> " + esc(attachmentName(item)) + "</li>"
      + "</ul>";
  }).join("");
  return "<p>Dear Hiring Manager,</p>"
    + "<p>I hope you are well. HR Plus (Talent) Limited would like to recommend the following candidate"
    + (mailPicked.length === 1 ? "" : "s")
    + " for " + rolePhrase + " at <strong>" + esc(company) + "</strong>.</p>"
    + blocks
    + "<p>Please tell us a convenient time for an interview, and we will coordinate it with the candidate.</p>"
    + "<p>Kind regards,</p>";
}

function fillMailLetter() {
  document.getElementById("mail-subject").value = mailSubject();
  document.getElementById("mail-body").innerHTML = mailHtml();
  mailTouched = false;
}

const MAIL_PAGE = 15;
let mailShown = MAIL_PAGE;

function drawMailResults() {
  const query = document.getElementById("mail-search").value.trim().toLowerCase();
  const box = document.getElementById("mail-results");
  const rows = mailPool().filter((row) => !query || rowSearchText(row).includes(query));
  const scrollTop = box.scrollTop;
  if (!rows.length) {
    box.innerHTML = "<p class=\"hint\">No matching CV. Save one first, then search by name, skill, or position.</p>";
    return;
  }
  const shown = rows.slice(0, mailShown);
  const more = rows.length - shown.length;
  box.innerHTML = shown.map((row) => {
    const chosen = mailPicked.some((item) => item.id === row.id);
    const title = (row.more && row.more.jobs && row.more.jobs[0] && row.more.jobs[0].role) || (row.job1 && row.job1[1]) || "";
    return "<button type=\"button\" class=\"mail-hit\" data-pick=\"" + esc(row.id) + "\"><span><strong>" + esc(row.candidate || row.fileName || "Untitled") + "</strong>"
      + (isSample(row) ? " <span class=\"sample-tag\">Sample</span>" : "")
      + (title ? " · " + esc(title) : "") + "</span><span>" + (chosen ? "Selected" : "Add") + "</span></button>";
  }).join("") + (more > 0 ? "<button type=\"button\" class=\"mail-more\" id=\"mail-more\">Show more (" + more + ")</button>" : "");
  box.querySelectorAll("[data-pick]").forEach((button) => {
    button.onclick = () => toggleMailPick(button.getAttribute("data-pick"));
  });
  const moreButton = document.getElementById("mail-more");
  if (moreButton) moreButton.onclick = () => { mailShown += MAIL_PAGE; drawMailResults(); };
  box.scrollTop = scrollTop;
}

function drawMailPicks() {
  const box = document.getElementById("mail-picks");
  if (!mailPicked.length) {
    box.innerHTML = "";
    return;
  }
  box.innerHTML = mailPicked.map((item) => {
    const name = esc((item.cv && item.cv.candidate) || "Candidate");
    return "<span class=\"mail-badge\"><span class=\"name\">" + name + "</span><span class=\"format-toggle\">"
      + "<button type=\"button\" data-format=\"pdf\" data-id=\"" + esc(item.id) + "\"" + (item.format === "pdf" ? " class=\"on\"" : "") + ">PDF</button>"
      + "<button type=\"button\" data-format=\"docx\" data-id=\"" + esc(item.id) + "\"" + (item.format === "docx" ? " class=\"on\"" : "") + ">Word</button>"
      + "</span><button type=\"button\" class=\"btn secondary\" data-rename=\"" + esc(item.id) + "\" style=\"padding:2px 8px;font-size:11px\">Rename</button><button type=\"button\" class=\"col-x\" data-drop=\"" + esc(item.id) + "\" aria-label=\"Remove\">×</button></span>";
  }).join("");
  box.querySelectorAll("[data-format]").forEach((button) => {
    button.onclick = () => {
      const item = mailPicked.find((row) => row.id === button.getAttribute("data-id"));
      if (item) item.format = button.getAttribute("data-format");
      drawMailPicks();
      if (!mailTouched) fillMailLetter();
    };
  });
  box.querySelectorAll("[data-drop]").forEach((button) => {
    button.onclick = () => toggleMailPick(button.getAttribute("data-drop"));
  });
  box.querySelectorAll("[data-rename]").forEach((button) => {
    button.onclick = async () => {
      const item = mailPicked.find((row) => row.id === button.getAttribute("data-rename"));
      if (!item || !item.cv) return;
      const current = cleanFileName(item.cv.fileName, item.cv.candidate ? "HR Plus CV - " + item.cv.candidate : "HR Plus CV");
      const next = await askText("Rename file", current);
      if (!next) return;
      const stored = loadAll().find((row) => row.id === item.id);
      if (stored) await renameRecord(stored, next);
      else item.cv.fileName = cleanFileName(next, current);
      drawMailPicks();
      if (!mailTouched) fillMailLetter();
    };
  });
}

function toggleMailPick(id) {
  const existing = mailPicked.findIndex((item) => item.id === id);
  if (existing >= 0) mailPicked.splice(existing, 1);
  else {
    if (mailPicked.length >= 8) {
      document.getElementById("mail-status").textContent = "You can attach up to 8 CVs.";
      return;
    }
    const cv = mailPool().find((row) => row.id === id);
    if (cv) mailPicked.push({ id: cv.id, format: "pdf", cv: cv });
  }
  drawMailResults();
  drawMailPicks();
  if (!mailTouched) fillMailLetter();
}

function openMail(draft) {
  mailLocked = !!(draft && draft.status === "SENT");
  document.getElementById("mail-send").hidden = mailLocked;
  document.getElementById("mail-draft").hidden = mailLocked;

    : [];
  document.getElementById("mail-to").value = draft && draft.to ? draft.to : "";
  document.getElementById("mail-company").value = draft && draft.company ? draft.company : "";

function mailPlain(html) {
  const box = document.createElement("div");
  box.innerHTML = html;
  box.querySelectorAll("li").forEach((item) => { item.prepend("• "); });
  return box.innerText.replace(/\n{3,}/g, "\n\n").trim();
}

function bytesToDataUrl(bytes, mime) {
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return "data:" + mime + ";base64," + btoa(binary);
}

async function filesForPicks() {
  const fresh = mailPool();
  mailPicked.forEach((item) => {
    const latest = fresh.find((row) => row.id === item.id);
    if (latest) item.cv = latest;
  });
  const root = document.getElementById("export-root");
  const files = [];
  try {
    for (const item of mailPicked) {
      renderInto(root, item.cv, false);
      const pages = await captureSheets(root);
      const pdf = item.format !== "docx";
      const bytes = pdf ? pdfFromPages(pages) : docxFromPages(pages);
      const base = cleanFileName(item.cv.fileName, item.cv.candidate ? "HR Plus CV - " + item.cv.candidate : "HR Plus CV");
      files.push({
        filename: base + (pdf ? ".pdf" : ".docx"),
        data: bytesToDataUrl(bytes, pdf ? "application/pdf" : "application/vnd.openxmlformats-officedocument.wordprocessingml.document")
      });
    }
  } finally {
    root.innerHTML = "";
  }
  return files;
}

let draftCache = [];
let draftReady = false;

function draftNames(draft) {
  return (draft.candidates || []).map((item) => {
    const cv = item && item.cv ? item.cv : {};
    return item.name || cv.candidate || "";
  }).filter(Boolean).join(" ");
}

function draftMatches(draft, query) {
  if (!query) return true;
  const hay = [draft.fileId, draft.company, draft.subject, draftNames(draft)].join(" ").toLowerCase();
  return hay.includes(query);
}

function paintDrafts() {
  const list = document.getElementById("draft-list");
  const status = document.getElementById("draft-status");
  const query = (document.getElementById("draft-q").value || "").trim().toLowerCase();
  const drafts = draftCache.filter((draft) => (draft.status === "SENT") === (draftView === "SENT") && draftMatches(draft, query));
  list.innerHTML = "";
  if (!draftReady) {
    status.textContent = "Drafts are available when this page is opened inside HR Plus.";
    return;
  }
  if (!drafts.length) {
    status.textContent = query ? "No matching email." : (draftView === "SENT" ? "No sent emails yet." : "No saved emails yet.");
    return;
  }
  status.textContent = "";
    list.innerHTML = drafts.map((draft) => "<div class=\"draft-row\"><span><strong>" + (draft.fileId ? "[" + esc(draft.fileId) + "] " : "") + esc(draft.subject || "Untitled email") + "</strong><br><span class=\"hint\">"
      + esc(draft.to || "") + "</span></span><span class=\"row-actions\">"
      + "<button type=\"button\" class=\"btn secondary\" data-draft=\"" + esc(draft.id) + "\">Open</button>"
      + "<button type=\"button\" class=\"btn secondary\" data-rename-draft=\"" + esc(draft.id) + "\">Rename</button>"
      + (draftView === "DRAFT" ? "<button type=\"button\" class=\"btn danger\" data-delete-draft=\"" + esc(draft.id) + "\">Delete Draft</button>" : "")
      + "</span></div>").join("");

    });
    list.querySelectorAll("[data-rename-draft]").forEach((button) => {
      button.onclick = () => renameDraft(button.getAttribute("data-rename-draft"));
    });
    list.querySelectorAll("[data-delete-draft]").forEach((button) => {
      button.onclick = async () => {
        await fetch("/api/cv-email/" + encodeURIComponent(button.getAttribute("data-delete-draft")), { method: "DELETE", credentials: "same-origin" });

async function drawDrafts() {
  const status = document.getElementById("draft-status");

    document.getElementById("draft-list").innerHTML = "";
    status.textContent = "Drafts are available when this page is opened inside HR Plus.";
  }
}

async function renameDraft(id) {
  const response = await fetch("/api/cv-email/" + encodeURIComponent(id), { credentials: "same-origin" });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok || !payload.draft) {
    document.getElementById("draft-status").textContent = (payload && payload.error) || "Could not open that draft.";
    return;
  }
  const draft = payload.draft;
  const next = await askText("Rename file", draft.subject || "");
  if (!next || next === draft.subject) return;
  const saved = await fetch("/api/cv-email", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      id: draft.id,
      to: draft.to,
      company: draft.company,
      position: draft.position,
      subject: next,
      bodyHtml: draft.bodyHtml,
      candidates: draft.candidates || []
    })
  });
  if (!saved.ok) {
    const err = await saved.json().catch(() => ({}));
    document.getElementById("draft-status").textContent = err.error || "Could not rename that draft.";
    return;
  }
  drawDrafts();
}

async function openDraft(id) {
  const response = await fetch("/api/cv-email/" + encodeURIComponent(id));
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    document.getElementById("draft-status").textContent = payload.error || "Could not open that draft.";

function joinParts(parts) {
  const sorted = parts.slice().sort((a, b) => a.x - b.x);
  let line = "";
  let end = 0;
  sorted.forEach((part) => {
    if (line && part.x > end + 2) line += " ";
    line += part.str;
    end = Math.max(end, part.end);
  });
  return line.replace(/[ \t]+/g, " ").trim();
}

function marginNote(text) {
  const value = String(text || "").trim();
  if (!value || value.length > 26) return false;
  if (/\d{4}/.test(value)) return true;
  return /^(present|current|now|to date)$/i.test(value);
}

function columnGutters(rows) {
  const gaps = [];
  rows.forEach((row) => {
    const parts = row.parts.slice().sort((a, b) => a.x - b.x);
    for (let i = 1; i < parts.length; i++) {
      const width = parts[i].x - parts[i - 1].end;
      if (width < 36) continue;
      gaps.push({ mid: (parts[i - 1].end + parts[i].x) / 2, width: width });
    }
  });
  if (gaps.length < 4) return [];
  gaps.sort((a, b) => a.mid - b.mid);
  const clusters = [];
  gaps.forEach((gap) => {
    const last = clusters[clusters.length - 1];
    if (!last || Math.abs(gap.mid - last.mid) > 28) clusters.push({ mid: gap.mid, gaps: [gap] });
    else {
      last.gaps.push(gap);
      last.mid = last.gaps.reduce((sum, item) => sum + item.mid, 0) / last.gaps.length;
    }
  });
  const needed = Math.max(4, Math.floor(rows.length * 0.35));
  return clusters.filter((cluster) => {
    if (cluster.gaps.length < needed) return false;
    const widths = cluster.gaps.map((gap) => gap.width).sort((a, b) => a - b);
    if (widths[Math.floor(widths.length / 2)] < 40) return false;
    const mid = cluster.mid;
    let leftLines = 0;
    let rightLines = 0;
    let crossing = 0;
    let rightLong = 0;
    let rightNotes = 0;
    let rightOther = 0;
    rows.forEach((row) => {
      const crosses = row.parts.some((part) => part.x < mid - 6 && part.end > mid + 6);
      if (crosses) crossing += 1;
      if (row.parts.some((part) => part.end <= mid + 4)) leftLines += 1;
      const right = row.parts.filter((part) => part.x >= mid - 4).map((part) => part.str).join(" ").trim();
      if (!right) return;
      rightLines += 1;
      if (marginNote(right)) rightNotes += 1;
      else rightOther += 1;
      if (right.length > 18 && !marginNote(right)) rightLong += 1;
    });
    return leftLines >= 4 && rightLines >= 4 && crossing <= rows.length * 0.25 && rightNotes * 2 < rightLines && (rightLong >= 3 || rightOther >= 4);
  }).map((cluster) => cluster.mid).sort((a, b) => a - b);
}

function partsInColumn(parts, gutters, index) {
  const from = index === 0 ? -Infinity : gutters[index - 1];
  const to = index === gutters.length ? Infinity : gutters[index];
  return parts.filter((part) => {
    const center = (part.x + part.end) / 2;
    return center >= from && center < to;
  });
}

function rowSpans(row, gutters) {
  return gutters.some((mid) => row.parts.some((part) => part.x < mid - 6 && part.end > mid + 6));
}

function linesFromItems(items) {
  const rows = [];
  items.forEach((item) => {
    if (!item.str || !String(item.str).trim() || !item.transform) return;
    const x = item.transform[4];
    const y = item.transform[5];
    let row = rows.find((entry) => Math.abs(entry.y - y) < 3);
    if (!row) {
      row = { y: y, parts: [] };
      rows.push(row);
    }
    row.parts.push({ x: x, end: x + (item.width || 0), str: item.str });
  });
  const ordered = rows.slice().sort((a, b) => b.y - a.y);
  const gutters = columnGutters(ordered);
  if (!gutters.length) return ordered.map((row) => joinParts(row.parts)).filter(Boolean).join("\n");
  const lines = [];
  let block = [];
  const flush = () => {
    if (!block.length) return;
    for (let index = 0; index <= gutters.length; index++) {
      const text = block.map((row) => joinParts(partsInColumn(row.parts, gutters, index))).filter(Boolean);
      if (text.length) lines.push(text.join("\n"));
    }
    block = [];
  };
  ordered.forEach((row) => {
    if (rowSpans(row, gutters)) {
      flush();
      const line = joinParts(row.parts);
      if (line) lines.push(line);
    } else block.push(row);
  });
  flush();
  return lines.join("\n\n");
}

function decodeXml(value) {
  return value
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/&quot;/g, "\"")
    .replace(/&#(\d+);/g, (_, code) => String.fromCharCode(Number(code)));
}

function docxToText(xml) {
  return xml.split(/<\/w:p>/).map((para) => {
    const bits = [];
    const marks = para.match(/<w:t[^>]*>[^<]*<\/w:t>|<w:tab\/>|<w:br[^>]*\/>/g) || [];
    marks.forEach((mark) => {
      if (mark.startsWith("<w:tab")) bits.push("\t");
      else if (mark.startsWith("<w:br")) bits.push("\n");
      else bits.push(decodeXml(mark.replace(/<[^>]+>/g, "")));
    });
    return bits.join("");
  }).join("\n");
}

async function pdfToText(bytes) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "cv/pdf.worker.min.js";
  const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    pages.push(linesFromItems(content.items));
  }
  return pages.filter(Boolean).join("\n\n");
}

function squarePhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      const width = 180;
      const height = 220;
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const scale = Math.max(width / image.width, height / image.height);
      const drawnWidth = image.width * scale;
      const drawnHeight = image.height * scale;
      canvas.getContext("2d").drawImage(image, (width - drawnWidth) / 2, (height - drawnHeight) / 2, drawnWidth, drawnHeight);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("photo"));
    };
    image.src = url;
  });
}

function parseCvDate(value) {
  const text = String(value || "").trim();
  const months = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  let match = text.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);
  if (match) return new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
  match = text.match(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
  if (match) return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
  match = text.match(/(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]+)\s+(\d{4})/);
  if (match && months[match[2].slice(0, 3).toLowerCase()] != null) {
    return new Date(Number(match[3]), months[match[2].slice(0, 3).toLowerCase()], Number(match[1]));
  }
  return null;
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function drawList() {

  const toValue = document.getElementById("q-to").value;

    if (from || to) {

      if (when) {
        if (from && when < from && !sameDay(when, from)) return false;
        if (to && when > to && !sameDay(when, to)) return false;
      }
    }

  });

        return;
      }
      if (button.dataset.act === "rename") {
        const next = await askText("Rename file", cleanFileName(row.fileName, row.candidate ? "HR Plus CV - " + row.candidate : "HR Plus CV"));
        if (next) await renameRecord(row, next);
        drawList();
        return;
      }
      if (button.dataset.act === "delete") {
        if (!window.confirm("Delete this saved CV?")) return;
        storeAll(loadAll().filter((item) => item.id !== row.id));
        fetch("/api/cv-record/" + encodeURIComponent(row.id), { method: "DELETE", credentials: "same-origin" }).catch(() => {});
        if (editingId === row.id) editingId = null;
        drawList();
        return;
      }
      const status = document.getElementById("status");
      try {
        await exportData(row, button.dataset.act === "pdf" ? "pdf" : "docx");
      } catch (error) {
        if (status) status.textContent = "The file could not be prepared.";
      }
    };
  });
}
["q-file", "q-name", "q-from", "q-to"].forEach((id) => {
  document.getElementById(id).oninput = drawList;
});
document.getElementById("clear-filters").onclick = () => {
  ["q-file", "q-name", "q-from", "q-to"].forEach((id) => {
    document.getElementById(id).value = "";
  });
  drawList();
};
pullCvs().finally(() => { if (!loadAll().length) seed(); });
document.getElementById("draft-q").oninput = () => { if (draftReady) paintDrafts(); };
document.getElementById("draft-tab-draft").onclick = () => { draftView = "DRAFT"; drawDrafts(); };
document.getElementById("draft-tab-sent").onclick = () => { draftView = "SENT"; drawDrafts(); };
</script>
</body>
</html>
