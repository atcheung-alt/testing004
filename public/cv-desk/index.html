<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="cv/fflate.js"></script>
<script src="cv/pdf.min.js"></script>
<script src="cv/html2canvas.min.js"></script>
<style>
  :root {
    --ink: #1b2436;
    --muted: #66708a;
    --line: #e3e8f3;
    --paper: #f5f7fc;
    --brand: #4f7cff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; overflow-x: hidden; }
  body {
    min-height: 100vh;
    color: var(--ink);
    background: var(--paper);
    font-family: Inter, "PingFang HK", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: min(980px, 100%); margin: 0 auto; padding: 32px 16px 64px; font-size: 14px; overflow-x: hidden; }
  .bar { margin-bottom: 16px; }
  h1 {
    margin: 0;
    font-family: Fraunces, "PingFang HK", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Georgia, serif;
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 2rem;
    letter-spacing: 0;
  }
  .note { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .stamps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .stamp {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .stamp.on { border-color: var(--brand); color: var(--brand); }
  .panel { display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: 0 1px 2px rgba(41, 58, 110, 0.04), 0 8px 24px rgba(41, 58, 110, 0.07);
  }
  .label {
    display: block;
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .drop, .save-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  .btn.primary {
    border: 0;
    color: #fff;
    background: linear-gradient(135deg, #4F7CFF 0%, #7F9BFA 45%, #9B6BEA 100%);
    box-shadow: 0 12px 32px rgba(79, 124, 255, 0.12);
  }
  .btn.secondary { background: #fff; color: var(--ink); border-color: var(--line); }
  .file { position: relative; }
  .file input { display: none; }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
  .input, .search {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
    background: #fff;
    font-size: 14px;
    outline: none;
  }
  .input:focus, .search:focus { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .save-row .input { flex: 1 1 220px; width: auto; }
  .filters {
    display: grid;
    grid-template-columns: 1.3fr 1.1fr 0.85fr 0.85fr auto;
    gap: 12px;
    align-items: end;
  }
  @media (max-width: 800px) {
    .filters { grid-template-columns: 1fr 1fr; }
  }
  .row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .file-name {
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .file-name:hover { color: var(--brand); }
  .row p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn.danger { background: #fff; color: #be3454; border-color: rgba(190, 52, 84, 0.35); }
  .sample-tag {
    display: inline-block;
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 999px;
    background: #eef2fb;
    color: #4a5568;
    font-size: 11px;
    font-weight: 600;
    vertical-align: 1px;
  }
  #export-root {
    position: fixed;
    left: 0;
    top: 0;
    width: 794px;
    pointer-events: none;
    z-index: -1;
    opacity: 0;
  }
  .ask-modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: rgba(27, 36, 54, 0.35);
  }
  .ask-panel {
    width: min(440px, 100%);
    padding: 20px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .ask-panel p { margin: 0 0 16px; }
  .ask-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

  .sheet-wrap { max-width: 100%; overflow-x: auto; }
  .sheet {
    position: relative;
    width: 794px;
    min-height: 1123px;
    margin: 18px auto;
    background: #fff;
    color: #000;
    font-family: Arial, "PingFang HK", "Microsoft JhengHei", sans-serif;
    padding: 18px 22px 64px;
    box-shadow: 0 8px 30px rgba(27, 36, 54, 0.08);
    overflow: hidden;
  }
  .mark {
    position: absolute;
    left: 50%;
    top: 280px;
    width: 620px;
    transform: translateX(-50%);
    opacity: 0.16;
    pointer-events: none;
    z-index: 0;
  }
  .sheet.cover {
    width: 210mm;
    height: 297mm;
    min-height: 297mm;
    max-height: 297mm;
    padding: 0;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #000;
  }
  .cover .centre-logo {
    top: 284px;
    left: -205px;
    width: 1000px;
    transform: none;
    opacity: 0.09;
    pointer-events: none;
  }
  .sheet.cover .head {
    position: absolute;
    top: 40px;
    right: 40px;
    left: auto;
    width: 280px;
    margin: 0;
    z-index: 2;
    text-align: right;
    pointer-events: none;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  .sheet.cover .head img { height: 46px; }
  .sheet.cover .cover-center {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .sheet.cover .title {
    position: absolute;
    top: 230px;
    left: 210px;
    width: auto;
    margin: 0;
    transform: none;
    white-space: nowrap;
    text-align: center;
    pointer-events: none;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 40px;
    font-weight: 800;
    line-height: 1.2;
    color: #000;
  }
  .sheet.cover .meta {
    position: absolute;
    top: 306px;
    left: 70px;
    width: 640px;
    margin: 0;
    transform: none;
    text-align: center;
    pointer-events: none;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  .cover .meta-line {
    display: block;
    margin: 0 0 16px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 20px;
    line-height: 1.6;
    text-align: center;
  }
  .cover .meta-line:last-child { margin-bottom: 0; }
  .cover .meta-line .k {
    display: inline;
    width: auto;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #000;
  }
  .cover .meta-line .val {
    display: inline;
    pointer-events: auto;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: #000;
    min-height: 0;
    padding: 0;
    white-space: nowrap;
    text-align: center;
    min-width: 80px;
    display: inline-block;
    vertical-align: baseline;
    cursor: text;
  }
  .sheet.cover .foot {
    left: 22px;
    right: 22px;
    bottom: 16px;
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 12px;
    line-height: 1.35;
    color: #444;
    text-align: center;
  }
  .sheet:not(.cover) > *:not(.mark):not(.foot) { position: relative; z-index: 1; }
  .sheet:not(.cover) .grid,
  .sheet:not(.cover) .block { margin: 0 0 24px; }
  .sheet:not(.cover) .band td,
  .sheet:not(.cover) .grid td,
  .sheet:not(.cover) .block td { padding: 10px 14px 10px 8px; }
  .sheet:not(.cover) .h {
    font-size: 16pt;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 10px 14px 10px 8px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.12);
  }
  .sheet:not(.cover) .title-edit { font-size: 16pt; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .sheet:not(.cover) .grid .k { font-size: 12pt; padding: 10px 14px 10px 8px; }
  .sheet:not(.cover) .val,
  .sheet:not(.cover) .lines,
  .sheet:not(.cover) .plain,
  .sheet:not(.cover) .col-text {
    font-size: 12pt;
    font-weight: 400;
    line-height: 1.6;
  }
  .sheet:not(.cover) .job-head { display: flex; align-items: baseline; gap: 12px; }
  .sheet:not(.cover) .job-head [data-field="role"] { flex: 1; font-size: 14pt; font-weight: 700; line-height: 1.6; text-align: left; }
  .sheet:not(.cover) .job [data-field="company"] { display: block; width: 100%; font-size: 13pt; font-weight: 600; line-height: 1.6; color: #3d4a63; margin: 0; text-align: left; }
  .sheet:not(.cover) .job [data-field="dates"],
  .sheet:not(.cover) #edu [data-field="year"] {
    display: block;
    width: 100%;
    margin: 0;
    padding: 0;
    text-align: left;
    font-size: 12pt;
    font-weight: 400;
    font-style: italic;
    line-height: 1.6;
    white-space: normal;
  }
  .sheet:not(.cover) .job { margin: 0 0 18px; padding: 0; border: 0; }
  .sheet:not(.cover) .job + .job { margin-top: 0; padding-top: 0; border-top: 0; }
  .sheet:not(.cover) #edu [data-field="school"] { display: block; width: 100%; text-align: left; font-size: 13pt; font-weight: 600; line-height: 1.6; }
  .sheet:not(.cover) [data-field="duties"],
  .sheet:not(.cover) .lines[data-field="text"],
  .sheet:not(.cover) [data-slot="project"] {
    display: block;
    width: 100%;
    font-size: 12pt;
    font-weight: 400;
    line-height: 1.6;
    min-height: 1.6em;
    text-align: left;
  }
  .sheet:not(.cover) [data-field="duties"] ul,
  .sheet:not(.cover) .lines[data-field="text"] ul,
  .sheet:not(.cover) [data-slot="project"] ul {
    margin: 0;
    padding: 0;
    list-style: none;
    text-align: left;
  }
  .sheet:not(.cover) [data-field="duties"] li,
  .sheet:not(.cover) .lines[data-field="text"] li,
  .sheet:not(.cover) [data-slot="project"] li {
    margin: 0;
    padding: 0;
    font-size: 12pt;
    font-weight: 400;
    line-height: 1.6;
    text-align: left;
  }
  .sheet:not(.cover) .line-row + .line-row { margin-top: 8px; }
  .head { text-align: right; }
  .head img { height: 46px; width: auto; }
  #profile td.photo-cell {
    width: 102px;
    padding: 6px;
    vertical-align: middle;
    text-align: center;
  }
  #profile .photo {
    width: 90px;
    height: 110px;
    object-fit: cover;
    display: block;
    border-radius: 6px;
  }
  .co { margin: 2px 0 0; font-weight: 700; font-size: 13px; }
  .title {
    margin: 18px 0 8px;
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 40pt;
    font-weight: 700;
    letter-spacing: 0;
  }
  .meta { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .meta td { padding: 2px 8px; font-size: 20px; vertical-align: baseline; }
  .meta .k { width: 42%; text-align: right; font-weight: 700; }
  .band, .grid, .block { width: 100%; border-collapse: collapse; margin: 0 0 10px; }
  .sheet:not(.cover) .grid,
  .sheet:not(.cover) .block,
  .sheet:not(.cover) .job,
  .sheet:not(.cover) [data-box],
  .sheet:not(.cover) tr {
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .sheet:not(.cover) .h,
  .sheet:not(.cover) .job .line-row,
  .sheet:not(.cover) .job > .col-text.b,
  .sheet:not(.cover) .job .lbl {
    break-after: avoid;
    page-break-after: avoid;
  }
  .band td, .grid td, .block td { border: 0.5pt solid #000; vertical-align: top; text-align: left; padding: 1px 3px; }
  .h {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 15px;
    padding: 1px 3px;
    text-align: left;
  }
  .h.profile { background: #B6C3F2; }
  .h.edu { background: #E2EFD9; }
  .h.cert { background: #FCE4D6; }
  .h.project { background: #DDEBF7; }
  .h.work { background: #FFF2CC; }
  .grid .k {
    width: 22%;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 12px;
    padding: 1px 3px;
    text-align: left;
  }
  .val, .lines, .job line, .plain, .pair, .col-text, .lbl {
    text-align: left;
  }
  .val, .lines, .job line, .plain, .col-text {
    font-family: Garamond, "EB Garamond", Palatino, "Palatino Linotype", serif;
    font-weight: 400;
    font-size: 11pt;
    line-height: 1.35;
    padding: 0;
    outline: none;
    min-height: 1.2em;
    white-space: pre-wrap;
  }
  .pair { padding: 6px 0 0; }
  .pair .lbl { padding: 0 0 2px; font-size: 12px; font-weight: 700; }
  .pair .val, .pair .lines { padding: 0 0 4px; }
  .title-edit { font-family: Georgia, "Times New Roman", serif; font-size: 15px; font-weight: 700; padding: 0; }
  .lines { min-height: 72px; }
  .job .b { font-family: Garamond, "EB Garamond", Palatino, "Palatino Linotype", serif; font-weight: 700; font-size: 11pt; padding: 0; outline: none; min-height: 1.2em; }
  .job .lbl { padding: 4px 0 0; font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 12px; }
  .job > .col-text { display: block; padding: 2px 0 0; }
  .line-row { display: flex; align-items: flex-start; gap: 6px; }
  .line-row + .line-row { margin-top: 4px; }
  .col-text { flex: 1; outline: none; font-size: 12px; line-height: 1.35; min-height: 1.2em; white-space: pre-wrap; }
  .col-text.b { font-weight: 700; }
  .col-x, .add-btn { border: 0; background: transparent; font-family: Inter, "PingFang HK", sans-serif; }
  .col-x { color: #8b93a7; font-size: 16px; line-height: 1; padding: 0 2px; }
  .col-x:hover { color: #be3454; }
  .add-row { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
  .add-btn { color: #4f7cff; font-size: 12px; font-weight: 600; padding: 2px 0; }
  .add-btn:hover { text-decoration: underline; }
  .section-add { margin: 0 0 10px; }
  .job + .job { border-top: 1px solid #e3e8f3; margin-top: 8px; padding-top: 8px; }
  .entry + .entry { margin-top: 8px; }
  .plain { min-height: 28px; }
  .sheet:not(.cover) [contenteditable="true"] ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .sheet:not(.cover) [contenteditable="true"] ol {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .sheet:not(.cover) [contenteditable="true"] li { margin: 0; padding: 0; }
  #fmt-bar {
    position: fixed;
    z-index: 30;
    display: none;
    align-items: center;
    gap: 2px;
    padding: 4px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(27, 36, 54, 0.12);
  }
  #fmt-bar.on { display: flex; }
  #fmt-bar button {
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #24304a;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }
  #fmt-bar button:hover { background: #eef2fb; }
  [contenteditable="true"]:empty:before {
    content: attr(data-placeholder);
    color: #8b93a7;
  }
  .foot {
    position: absolute;
    left: 22px;
    right: 22px;
    bottom: 16px;
    z-index: 1;
    text-align: center;
    font-size: 10px;
    line-height: 1.35;
  }
  .sheet.exporting { box-shadow: none; }
  .sheet.exporting .col-x,
  .sheet.exporting .add-row { display: none; }
  .sheet.exporting .cover-drag { outline: none; }
  .sheet.exporting [contenteditable="true"]:empty:before { content: none; }
  .mail-modal {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: rgba(27, 36, 54, 0.35);
    overflow: hidden;
  }
  .mail-panel {
    width: min(1080px, 100%);
    max-height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
    margin: 0;
    background: #fff;
    border-radius: 16px;
    border: 1px solid var(--line);
    box-shadow: 0 16px 40px rgba(27, 36, 54, 0.12);
    overflow: hidden;
  }
  .mail-head, .mail-foot { flex: none; padding: 16px 20px; }
  .mail-head { padding-bottom: 8px; }
  .mail-foot { border-top: 1px solid var(--line); }
  .mail-panel h2 { margin: 0 0 4px; font-size: 1.25rem; }
  .mail-columns {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(280px, 0.9fr) minmax(340px, 1.1fr);
    gap: 16px;
    padding: 0 20px 12px;
    overflow: hidden;
  }
  .mail-side, .mail-preview {
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .mail-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
    flex: none;
  }
  .mail-label {
    display: block;
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
  }
  #mail-send:disabled { opacity: 0.6; }
  .mail-results {
    flex: none;
    max-height: 220px;
    margin-top: 8px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .mail-more {
    border: 0;
    background: transparent;
    color: var(--brand);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 2px 2px;
    text-align: left;
  }
  .mail-picks {
    flex: none;
    max-height: 96px;
    margin-top: 8px;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .mail-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    padding: 4px 6px 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #f5f7fc;
    font-size: 12px;
  }
  .mail-badge .name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-hit, .draft-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .mail-hit { width: 100%; background: #fff; text-align: left; flex: none; }
  .format-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
  .format-toggle button { border: 0; background: #fff; padding: 3px 8px; font-size: 11px; }
  .format-toggle button.on { background: #4F7CFF; color: #fff; }
  .mail-editor {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .mail-editor:focus-within { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .mail-tools {
    display: flex;
    flex: none;
    align-items: center;
    gap: 2px;
    padding: 4px 6px;
    border-bottom: 1px solid var(--line);
    background: #f7f8fb;
  }
  .mail-tools button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;

const DUTY = ["key duties", "job duties", "main duties", "responsibilities", "responsibility", "job description", "duties", "duty", "主要職責", "職責", "工作內容"];

const KEY = "hrplus-online-cv-v2";

function today() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear();
}

function norm(s) {
  return s.toLowerCase().replace(/[：﹕]/g, ":").replace(/\s+/g, " ").trim();
}

function escapeReg(text) {
  return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function explodeSections(text) {
  const labels = [];
  GROUPS.forEach((group) => {
    if (group.key === "name") return;
    group.names.forEach((name) => {
      if (name.includes(" ") || name.length >= 8) labels.push(name);
    });
  });
  labels.sort((a, b) => b.length - a.length);
  const re = new RegExp("([^\\n]{10})[ \\t]+(" + labels.map(escapeReg).join("|") + ")(?=[ \\t]*[:：]?\\s)", "gi");
  return text
    .replace(re, "$1\n$2")
    .replace(/([^\n]{10})[ \t]+(job description|responsibilities|key duties|main duties)\b/gi, "$1\n$2");
}

function matchHeading(line) {
  const raw = norm(line);
  const bare = raw.replace(/[:：]\s*$/, "");
  let best = null;
  for (const group of GROUPS) {
    for (const name of group.names) {
      const exact = bare === name;
      const colon = raw.startsWith(name + ":");
      const multi = name.includes(" ") && (exact || colon || raw.startsWith(name + " "));
      const single = !name.includes(" ") && (exact || colon);
      if (!exact && !colon && !multi && !single) continue;
      if (best && best.name.length >= name.length) continue;
      const inline = line.slice(name.length).replace(/^[:：\-—\s]+/, "");
      best = { key: group.key, name, inline };
    }
  }
  return best;
}

function prepareCvText(text) {
  const lines = String(text || "").split(/\r?\n/).map((line) => line.replace(/[ \t]+/g, " ").trim()).filter((line) => {
    if (!line) return false;
    if (/^\d{4,}$/.test(line)) return false;
    if (/^(center)?\d{6,}$/i.test(line.replace(/\s/g, ""))) return false;
    return true;
  });
  const unique = [];
  lines.forEach((line) => {
    if (unique[unique.length - 1] !== line) unique.push(line);
  });
  const joined = [];
  for (let index = 0; index < unique.length; index++) {
    const line = unique[index];
    const next = unique[index + 1] || "";
    if (/[–—-]\s*$/.test(line) && /^(present|now|current|至今|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(?:19|20)\d{2})/i.test(next)) {
      joined.push((line.replace(/[–—-]\s*$/, "–") + " " + next).replace(/\s+/g, " "));
      index += 1;
      continue;
    }
    joined.push(splitGlued(line));
  }
  return joined.join("\n");
}

function splitGlued(line) {
  return line
    .replace(/([a-z])([A-Z])/g, "$1 $2")
    .replace(/\b([A-Z][\w'’-]*(?:\s+[A-Z][\w'’-]*){0,5})\s+((?:Hogeschool|University|College|School|Institute|Academy)\b.*)/g, "$1 | $2")
    .replace(/\b((?:junior|senior|assistant|lead)\s+)?([A-Za-z]+(?:\s+[A-Za-z]+){0,4}\s+(?:manager|coordinator|marketeer|designer|analyst|officer|director|assistant|specialist|engineer|consultant))\s+([A-Z][^,\n]{1,40},\s*[^,\n]+)/gi, "$1$2 | $3");
}

function isDateFragment(line) {
  const value = String(line || "").trim();
  return /^(present|now|current|至今)$/i.test(value) || /^(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(?:19|20)\d{2}\s*[–—-]*$/i.test(value);
}

function splitDate(line) {
  const patterns = [
    /^((?:19|20)\d{2}(?:[./]\d{1,2})?\s*[–—~-]+\s*(?:(?:19|20)\d{2}(?:[./]\d{1,2})?|present|now|current|至今))\s*(.*)$/i,
    /^((?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(?:19|20)\d{2}\s*[–—~-]+\s*(?:(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(?:19|20)\d{2}|present|now|current|至今))\s*(.*)$/i,
    /^((?:19|20)\d{2}\s*年\s*\d{0,2}\s*月?\s*[–—~-到至]+\s*(?:(?:19|20)\d{2}\s*年\s*\d{0,2}\s*月?|至今|现在|現在))\s*(.*)$/
  ];
  for (const pattern of patterns) {
    const match = line.trim().match(pattern);
    if (match) return { dates: match[1].replace(/\s+/g, " ").trim(), rest: (match[2] || "").trim() };
  }
  return null;
}

function isSchool(text) {
  return /university|college|polytechnic|polyu|institute|school|academy|大學|學院|理工|\b(hku|cuhk|hkust|cityu|hku\s*space|\bspace\b|vtc|ied)\b/i.test(text || "");
}

function looksLikeEmployer(text) {
  return /\b(limited|ltd\.?|inc\.?|corporation|company|intern|engineer|manager|consultant)\b|有限公司/i.test(text || "");
}

function isDegree(text) {
  return /\b(bachelor|master|diploma|degree|phd|doctor|bsc|msc|ba|bs|beng|meng|associate|llb|jd)\b|\(bachelor\)|\(master\)/i.test(text || "");
}

function splitOrgRole(rest) {
  const glued = rest.split(/\s+\|\s+/);
  if (glued.length === 2) return { org: glued[1].trim(), role: glued[0].trim() };
  const orgSuffix = rest.match(/^(.*?(?:\b(?:Limited|Ltd\.?|Inc\.?|Corp\.?|Corporation|Company|Group|Hospital|Bank)\b|有限公司))\s*(.*)$/i);
  if (orgSuffix && orgSuffix[2].trim()) return { org: orgSuffix[1].trim(), role: orgSuffix[2].trim() };
  const roleRe = /\b((?:senior|junior|lead|full[\s-]?stack|software|data|system|systems|front[\s-]?end|back[\s-]?end)\s+)*(?:engineer|developer|intern|manager|analyst|consultant|officer|designer|specialist|assistant|director|supervisor)\b.*$/i;
  const role = rest.match(roleRe);
  if (role && role.index > 0 && role.index < 48 && rest.length < 90 && !/[.。]/.test(rest)) return { org: rest.slice(0, role.index).trim(), role: role[0].trim() };
  return { org: rest.trim(), role: "" };
}

function splitSchoolDegree(rest) {
  const school = rest.match(/^(.*?\b(?:University|College|Polytechnic|Institute|School|Academy|大學|學院)(?:\s+of\s+(?:[A-Z][\w.-]*\s*){1,3})?)\s+(.*)$/);
  if (school && isDegree(school[2])) return [school[1].trim(), school[2].trim()];
  return [rest.trim()];
}

function dutyBody(line) {
  const n = norm(line);
  const labels = DUTY.slice().sort((a, b) => b.length - a.length);
  for (const label of labels) {
    if (n === label || n.startsWith(label + ":") || n.startsWith(label + " ")) {
      return line.slice(label.length).replace(/^[:：\s]+/, "");
    }
  }
  return null;
}

function dutyPieces(text) {
  const cleaned = String(text || "").replace(/^(job description|responsibilities|key duties|main duties|duties)\s*[:：]\s*/i, "");
  return cleaned
    .split(/\n+|;\s+|•\s+|(?<=[.。])\s+/)
    .flatMap((part) => part.length > 280 ? part.split(/:\s+/) : [part])
    .map((part) => part.replace(/^[-–—•]\s*/, "").trim())
    .filter((part) => part.length > 2);
}

function joinParen(lines) {
  const out = [];
  let buf = "";
  let depth = 0;
  lines.forEach((line) => {
    const text = String(line || "").trim();
    if (!text) return;
    if (!buf) buf = text;
    else buf += (depth > 0 && !buf.endsWith("(") ? ", " : " ") + text;
    depth += (text.match(/\(/g) || []).length - (text.match(/\)/g) || []).length;
    if (depth <= 0) {
      out.push(buf.replace(/\s+/g, " ").trim());
      buf = "";
      depth = 0;
    }
  });
  if (buf) out.push(buf.replace(/\s+/g, " ").trim());
  return out;
}

function splitOutsideParens(text) {
  const parts = [];
  let buf = "";
  let depth = 0;
  for (const ch of String(text || "")) {
    if (ch === "(") depth += 1;
    else if (ch === ")" && depth) depth -= 1;
    if ((ch === ";" || ch === "；" || ch === "," || ch === "，" || ch === "、") && depth === 0) {
      if (buf.trim()) parts.push(buf.trim());
      buf = "";
      continue;
    }
    buf += ch;
  }
  if (buf.trim()) parts.push(buf.trim());
  return parts;
}

function tidyPiece(text) {
  return String(text || "")
    .replace(/\s*\(\s*/g, " (")
    .replace(/\s+/g, " ")
    .replace(/\s*\)/g, ")")
    .replace(/[.;]+$/g, "")
    .replace(/\bmicrosoft word\b/i, "Microsoft Word")

}

function isPersonalNoise(text) {
  const line = String(text || "").trim();
  if (!line || line.length < 2) return true;
  if (/@/.test(line)) return true;
  if (/^\+?\d[\d\s-]{5,}$/.test(line)) return true;
  if (/^(about me|personal details|contact details|contact|自我介紹|關於我)$/i.test(line)) return true;
  if (/^(january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{1,2}$/i.test(line)) return true;
  if (/^(19|20)\d{2}$/.test(line)) return true;
  if (/^(hong kong|kowloon|yuen long|new territories|sha tin|tsuen wan|tuen mun|香港|元朗|九龍)$/i.test(line)) return true;
  return false;
}

function isJobTitle(text) {
  return text.length < 90 && !/\(/.test(text) && /\b(intern|engineer|developer|manager|analyst|officer|assistant|consultant|designer|supervisor)\b/i.test(text);
}

function collectRelated(lines) {
  const skills = [];
  const edu = [];
  const work = [];
  const seen = new Set();
  const keep = (list, text) => {
    const key = norm(text);
    if (!key || seen.has(key)) return;
    seen.add(key);
    list.push(text);
  };
  joinParen(lines).forEach((line) => {
    splitOutsideParens(line).forEach((part) => {
      const text = tidyPiece(part);
      if (isPersonalNoise(text)) return;
      if (isDegree(text)) keep(edu, text);
      else if (isJobTitle(text)) keep(work, text);
      else if (text.length < 90) keep(skills, text);
    });
  });
  return { skills, edu, work };
}

function splitSkills(lines) {
  return collectRelated(lines).skills;
}

function isBullet(line) {
  return /^([-•*·]|\d+[.)])\s+/.test(line.trim());
}

function cleanBullet(line) {
  return line.trim().replace(/^([-•*·]|\d+[.)])\s+/, "");
}

function linesOf(text) {
  return text.split(/\r?\n/).map((line) => line.trim()).filter((line, i, all) => line || (i > 0 && all[i - 1]));
}

function takeLines(bucket) {
  return bucket.map((line) => line.trim()).filter(Boolean);
}

const SPOKEN = [
  [/cantonese|粵語|廣東話|广东话/i, "Cantonese"],
  [/putonghua|mandarin|普通話|普通话|國語|国语/i, "Putonghua"],
  [/english|英語|英文/i, "English"],
  [/french|法語|法文/i, "French"],
  [/japanese|日語|日文/i, "Japanese"],
  [/korean|韓語|韩语|韓文/i, "Korean"],
  [/spanish|西班牙語|西班牙语/i, "Spanish"],
  [/german|德語|德语/i, "German"],
  [/italian|意大利語|義大利語|意大利语/i, "Italian"],
  [/portuguese|葡萄牙語|葡萄牙语/i, "Portuguese"],
  [/thai|泰語|泰语|泰文/i, "Thai"],
  [/vietnamese|越南語|越南语/i, "Vietnamese"],
  [/hindi|印地語|印地语/i, "Hindi"],
  [/malay|馬來語|马来语/i, "Malay"],
  [/tagalog|他加祿|他加禄/i, "Tagalog"],
  [/arabic|阿拉伯語|阿拉伯语/i, "Arabic"],
  [/russian|俄語|俄语/i, "Russian"],
  [/dutch|荷蘭語|荷兰语/i, "Dutch"],
  [/chinese|中文/i, "Chinese"]
];

function spokenFrom(text) {
  const hits = [];
  const raw = String(text || "");
  SPOKEN.forEach(([pattern, label]) => {
    const re = new RegExp(pattern.source, "gi");
    let match;
    while ((match = re.exec(raw))) hits.push({ index: match.index, label: label });
  });
  hits.sort((a, b) => a.index - b.index);
  const found = [];
  hits.forEach((hit) => {
    if (!found.includes(hit.label)) found.push(hit.label);
  });
  if (found.includes("Cantonese") || found.includes("Putonghua")) return found.filter((item) => item !== "Chinese");
  return found;
}

function looksLikeLanguageList(line) {
  const spoken = spokenFrom(line);
  if (!spoken.length || String(line || "").length > 80 || splitDate(line)) return false;
  let rest = String(line || "");
  SPOKEN.forEach(([pattern]) => {
    rest = rest.replace(new RegExp(pattern.source, "ig"), " ");
  });
  rest = rest.replace(/languages?|spoken|native|fluent|proficient|mother tongue|語言|语言|能力|和|及|與|与|and|\/|,|，|、|;|；|:|：|\(|\)|level|basic|intermediate|advanced|good|fair|excellent/gi, " ");
  return rest.replace(/\s+/g, " ").trim().length <= 12;
}

function collectLangs(lines, allowSingle) {
  const found = [];
  (lines || []).forEach((line) => {
    const spoken = spokenFrom(line);
    if (!spoken.length || !looksLikeLanguageList(line)) return;
    const marked = /\b(native|fluent|spoken|mother tongue|proficient)\b|語言|语言/i.test(line);
    if (!allowSingle && spoken.length < 2 && !marked) return;
    spoken.forEach((lang) => {
      if (!found.includes(lang)) found.push(lang);
    });
  });
  return found;
}

function pickLanguages(text, bagLines) {
  const fromBag = collectLangs(bagLines, true);
  if (fromBag.length) return fromBag.join(", ");
  const lines = String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
  const fromDoc = collectLangs(lines, false);
  return fromDoc.length ? fromDoc.join(", ") : "Cantonese, English";
}

function nameWords(line) {
  let text = String(line || "").split(/[|｜]/)[0];
  text = text.replace(/\([^)]*\)/g, " ");
  text = text.replace(/\S+@\S+/g, " ");
  text = text.replace(/\+?\d[\d\s()-]{5,}/g, " ");
  const dash = text.split(/\s+[–—-]\s+/);
  if (dash.length > 1) text = dash[0];
  text = text.replace(/^(mr|mrs|ms|miss|dr|prof)\.?\s+/i, "");
  text = text.replace(/[,，]/g, " ");
  text = text.replace(/\b[\p{Lu}]\./gu, " ");
  return text.replace(/\s+/g, " ").trim();
}

function isPersonName(line) {
  const text = nameWords(line);
  if (!text || text.length < 2 || text.length > 40) return false;
  if (text.includes("@") || text.includes(":") || /\d/.test(text)) return false;
  if (matchHeading(text) || softHeading(text) || splitDate(text)) return false;
  if (isPersonalNoise(text) || isJobTitle(text) || isSchool(text) || isDegree(text) || looksLikeEmployer(text)) return false;
  if (/^(curriculum vitae|resume|cv|personal information|personal details|personal summary|profile|about me|contact|objective|summary|cover letter|confidential)$/i.test(text)) return false;
  if (/^[\u4e00-\u9fff]{2,4}$/.test(text.replace(/\s/g, ""))) return true;
  if (/[.。!?]/.test(text)) return false;
  const words = text.split(" ");
  if (words.length < 2 || words.length > 4) return false;
  const role = /\b(leader|executive|officer|specialist|coordinator|representative|consultant|director|supervisor|assistant|associate|intern|engineer|developer|manager|analyst|designer|secretary|teacher|nurse|accountant|cashier|sales|marketing|operations|summary|profile|objective|curriculum|vitae|resume|limited|company)\b/i;
  if (role.test(text)) return false;
  return words.every((word) => {
    if (/^[\p{Lu}]$/u.test(word)) return true;
    return /^[\p{L}][\p{L}'’-]*$/u.test(word) && word.length > 1 && (word === word.toUpperCase() || /^[\p{Lu}\u4e00-\u9fff]/u.test(word));
  });
}

function pickCandidateName(text) {
  const lines = String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
  const stop = new Set(["work", "education", "project", "certs", "skills"]);
  const head = [];
  for (const line of lines) {
    if (head.length >= 18) break;
    const heading = matchHeading(line) || softHeading(line);
    if (heading && stop.has(heading.key)) break;
    if (heading && heading.key === "name") {
      if (isPersonName(heading.inline)) return nameWords(heading.inline);
      continue;
    }
    head.push(line);
  }
  const labeled = head.find((line) => /^(full name|candidate name|name|姓名|候選人|候选人)\s*[:：]/i.test(line));
  if (labeled && isPersonName(labeled.replace(/^[^:：]+[:：]\s*/, ""))) return nameWords(labeled.replace(/^[^:：]+[:：]\s*/, ""));
  const named = head.find(isPersonName);
  return named ? nameWords(named) : "";
}

function parseCv(text) {
  text = prepareCvText(text);
  const rows = explodeSections(text).split(/\r?\n/);
  const bags = {};
  let current = null;
  const loose = [];
  for (const row of rows) {
    const line = row.trim();
    if (!line) {
      if (current) bags[current].push("");
      continue;
    }
    const heading = matchHeading(line) || softHeading(line);
    if (heading) {
      current = heading.key;
      bags[current] = bags[current] || [];
      if (heading.inline) bags[current].push(heading.inline);
      continue;
    }
    if (current) bags[current].push(line);
    else loose.push(line);
  }

  const looseBits = classifyLoose(loose);
  const peeled = peelMisfiled(takeLines(bags.education || []).concat(looseBits.edu));
  const data = blank();
  data.candidate = pickCandidateName(text);
  data.date = today();
  data.languages = pickLanguages(text, takeLines(bags.languages || []));
  const related = collectRelated(takeLines(bags.skills || []).concat(peeled.skills, looseBits.skills));
  data.skills = pad(related.skills, 7);
  data.recentSalary = takeLines(bags.recentSalary || []).join(" ");
  data.expectedSalary = takeLines(bags.expectedSalary || []).join(" ");
  data.notice = takeLines(bags.notice || []).join(" ");
  fillEducation(data, peeled.edu);
  placeStudy(data, related.edu);
  data.certs = pad(takeLines(bags.certs || []).filter((line) => !isPersonalNoise(tidyPiece(line))), 2);
  data.project = pad(takeLines(bags.project || []).filter((line) => !isPersonalNoise(tidyPiece(line))), 5);
  const workRows = (bags.work || []).concat(looseBits.work, peeled.work.length ? [""].concat(peeled.work) : []);
  fillWork(data, workRows);
  placeTitles(data, related.work);
  return rescue(data, text);
}

function softHeading(line) {
  const raw = norm(line).replace(/[:：|].*$/, "").replace(/\s+/g, " ").trim();
  if (!raw || raw.length > 32 || splitDate(line) || /\d{3,}/.test(raw)) return null;
  const rules = [
    ["education", /^(education|academic|academics|qualification|qualifications|學歷|学历|教育|教育背景)$/],
    ["work", /^(experience|experiences|employment|career|work|internship|internships|工作經歷|工作经验|工作經驗|實習|实习|经历|經歷)$/],
    ["skills", /^(skills|skill|technical skills|competencies|技術|技能|专业技能|專業技能)$/],
    ["project", /^(projects|project|portfolio|項目|项目|專案)$/],
    ["certs", /^(certificates|certification|certifications|licenses|licences|awards|證書|证书|獎項)$/],
    ["languages", /^(languages|language|語言|语言)$/]
  ];
  for (const [key, pattern] of rules) {
    if (pattern.test(raw)) return { key: key, name: raw, inline: "" };
  }
  return null;
}

function skillish(line) {
  if (splitDate(line) || isSchool(line) || line.length > 180) return false;
  const bits = line.split(/[,，、;；|]/).map((part) => part.trim()).filter(Boolean);
  return bits.length >= 3 && bits.every((part) => part.length < 36);
}

function projectish(text) {
  const line = String(text || "");
  if (!line || line.length > 180 || matchHeading(line) || softHeading(line)) return false;
  if (/\b(exhibition|exhibit|museum|showcase|confluence|festival|展覽|展覽會)\b/i.test(line)) return true;
  return /\b(project|projects|項目|專案|专案)\b/i.test(line) && line.length < 100 && !/including|such as|etc\./i.test(line);
}

function mineJobs(lines) {
  const jobs = [];
  let index = 0;
  while (index < lines.length) {
    const line = lines[index].trim();
    const dated = line && splitDate(line);
    const schoolDate = dated && (isSchool(dated.rest) || isDegree(dated.rest));
    if (!dated || schoolDate || matchHeading(line) || softHeading(line) || projectish(line)) {
      index += 1;
      continue;
    }
    const follow = [];
    let next = index + 1;
    while (next < lines.length) {
      const row = lines[next].trim();
      if (!row) {
        next += 1;
        if (follow.length) break;
        continue;
      }
      if (matchHeading(row) || softHeading(row) || splitDate(row) || projectish(row)) break;
      follow.push(row);
      next += 1;
    }
    const about = [dated.rest].concat(follow).join(" ");
    if (isSchool(about) || isDegree(about)) {
      index += 1;
      continue;
    }
    const before = [];
    for (let back = index - 1; back >= 0 && before.length < 2; back--) {
      const row = lines[back].trim();
      if (!row) {
        if (before.length) break;
        continue;
      }
      if (matchHeading(row) || softHeading(row) || splitDate(row) || projectish(row) || row.length > 60 || /[.。]$/.test(row)) break;
      if (dutyBody(row) !== null || isBullet(row)) break;
      before.unshift(row);
    }
    while (follow[0] && (dutyBody(follow[0]) === "" || follow[0].length > 70)) {
      if (dutyBody(follow[0]) === "") follow.shift();
      else break;
    }
    const org = splitOrgRole(dated.rest || before[0] || follow.shift() || "");
    let title = org.role || before[1] || "";
    if (!title && follow[0] && follow[0].length < 70 && dutyBody(follow[0]) === null && !isBullet(follow[0])) title = follow.shift();
    const duties = [];
    follow.forEach((item) => {
      const duty = dutyBody(item);
      if (duty === "") return;
      if (duty) duties.push.apply(duties, dutyPieces(duty));
      else if (isBullet(item) || item.length > 20) duties.push.apply(duties, dutyPieces(cleanBullet(item)));
    });
    if (org.org || title || duties.length) jobs.push({ company: org.org, title: title || "", dates: dated.dates, duties: duties });
    index = Math.max(next, index + 1);
  }
  return jobs;
}

function mineProjects(lines) {
  const blocks = [];
  for (let index = 0; index < lines.length; index++) {
    const line = lines[index].trim();
    if (!projectish(line)) continue;
    const block = [line];
    let next = index + 1;
    while (next < lines.length && block.length < 5) {
      const row = lines[next].trim();
      if (!row || matchHeading(row) || softHeading(row) || splitDate(row)) break;
      block.push(row);
      next += 1;
    }
    blocks.push(block);
    index = next - 1;
  }
  return blocks;
}

function rescue(data, text) {
  const lines = String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
  if (!data.eduLeft && !data.edu.filter(Boolean).length) {
    const eduLines = [];
    lines.forEach((line, index) => {
      const dated = splitDate(line);
      const ahead = lines.slice(index + 1, index + 4).join(" ");
      if (dated && (isSchool(dated.rest) || isDegree(dated.rest) || isSchool(ahead) || isDegree(ahead))) eduLines.push(line);
      else if (!dated && (isSchool(line) || isDegree(line)) && line.length < 90) eduLines.push(line);
    });
    if (eduLines.length) fillEducation(data, eduLines);
  }
  if (!data.job1[0] && !data.job1[1] && !data.job1[2]) {
    const jobs = mineJobs(lines);
    if (jobs[0]) {
      data.job1 = [jobs[0].company, jobs[0].title, jobs[0].dates];
      data.duty1 = pad(jobs[0].duties, 6);
    }
    if (jobs[1]) {
      data.job2 = [jobs[1].company, jobs[1].title, jobs[1].dates];
      data.duty2 = pad(jobs[1].duties, 5);
    }
  }
  if (!data.project.filter(Boolean).length) {
    const blocks = mineProjects(lines);
    if (blocks.length) data.project = pad(blocks[0], 5);
  }
  if (!data.skills.filter(Boolean).length) {
    const line = lines.find(skillish);
    if (line) data.skills = pad(splitSkills([line]), 7);
  }
  return data;
}

function classifyLoose(lines) {
  const edu = [];
  const work = [];
  const skills = [];
  let mode = "";
  lines.forEach((line) => {
    const heading = matchHeading(line);
    if (heading && (heading.key === "education" || heading.key === "work" || heading.key === "skills")) {
      mode = heading.key === "education" ? "edu" : heading.key;
      if (heading.inline) (mode === "edu" ? edu : mode === "skills" ? skills : work).push(heading.inline);
      return;
    }
    const dated = splitDate(line);
    if (dated && (isSchool(dated.rest) || isDegree(dated.rest))) mode = "edu";
    else if (dated && dated.rest && !isSchool(dated.rest)) mode = "work";
    if (mode === "edu") edu.push(line);
    else if (mode === "work") work.push(line);
    else if (mode === "skills") skills.push(line);
  });
  return { edu, work, skills };
}

function peelMisfiled(lines) {
  const edu = [];
  const work = [];
  const skills = [];
  let mode = "edu";
  lines.forEach((line) => {
    const heading = matchHeading(line);
    if (heading && (heading.key === "skills" || heading.key === "work")) {
      mode = heading.key;
      if (heading.inline) (mode === "skills" ? skills : work).push(heading.inline);
      return;
    }
    const dated = splitDate(line);
    if (mode === "edu" && dated && looksLikeEmployer(dated.rest) && !isSchool(dated.rest)) mode = "work";
    if (mode === "skills") skills.push(line);
    else if (mode === "work") work.push(line);
    else edu.push(line);
  });
  return { edu, work, skills };
}

function placeStudy(data, lines) {
  lines.forEach((line) => {
    if (data.edu.some((item) => norm(item) === norm(line))) return;
    const empty = data.edu.findIndex((item) => !item);
    if (empty >= 0) data.edu[empty] = line;
  });
}

function placeTitles(data, titles) {
  const slots = [data.job1, data.job2];
  titles.forEach((title) => {
    const taken = slots.some((job) => norm(job[0]) === norm(title) || norm(job[1]) === norm(title));
    if (taken) return;
    const open = slots.find((job) => !job[0] && !job[1]);
    if (open) open[1] = title;
  });
}

function pad(list, n) {
  const out = list.slice(0, n);
  while (out.length < n) out.push("");
  if (list.length > n) out[n - 1] = [out[n - 1], ...list.slice(n)].filter(Boolean).join("; ");
  return out;
}

function fillEducation(data, lines) {
  const right = [];
  lines.forEach((line) => {
    if (isSchool(line) === false && isDegree(line) === false && !splitDate(line) && line.length > 180) return;
    const dated = splitDate(line);
    if (dated && (isSchool(dated.rest) || isDegree(dated.rest) || !dated.rest)) {
      if (!data.eduLeft) data.eduLeft = dated.dates;
      else right.push(dated.dates);
      const rest = splitGlued(dated.rest || "");
      if (rest) rest.split(/\s+\|\s+/).forEach((part) => right.push(part));
      return;
    }
    splitGlued(line).split(/\s+\|\s+/).forEach((part) => {
      if (isSchool(part) || isDegree(part) || part.length < 120) right.push(part);
    });
  });
  data.edu = pad(right.filter((line) => !/^programming\b/i.test(line)), 4);
}

function fillWork(data, rows) {
  const jobs = [];
  let job = null;
  const push = () => {
    if (job && (job.company || job.title || job.dates || job.duties.length)) jobs.push(job);
  };
  const start = () => {
    push();
    job = { company: "", title: "", dates: "", duties: [], phase: "head" };
  };
  const addDuties = (text) => {
    job.phase = "duty";
    dutyPieces(text).forEach((piece) => job.duties.push(piece));
  };
  const dates = [];
  start();
  for (const row of rows) {
    const line = row.trim();
    if (!line) {
      if (job.phase === "duty" && job.duties.length) start();
      continue;
    }
    if (isDateFragment(line)) {
      dates.push(line.replace(/\s+/g, " "));
      continue;
    }
    const duty = dutyBody(line);
    if (duty !== null) {
      if (duty) addDuties(duty);
      else job.phase = "duty";
      continue;
    }
    const dated = splitDate(line);
    if (dated && !isSchool(dated.rest)) {
      dates.push(dated.dates);
      const rest = dated.rest;
      if (rest) {
        const org = splitOrgRole(splitGlued(rest));
        if (job.title || job.company) start();
        job.company = org.org;
        job.title = org.role;
        job.dates = dates.shift() || dated.dates;
        job.phase = "after";
      }
      continue;
    }
    const org = splitOrgRole(splitGlued(line));
    if (org.role && org.org && !isBullet(line)) {
      if (job.title || job.company || job.duties.length) start();
      job.title = org.role;
      job.company = org.org;
      job.dates = dates.shift() || "";
      job.phase = "after";
      continue;
    }
    if (isBullet(line) || job.phase === "duty" || (job.title && line.length > 40)) {
      addDuties(cleanBullet(line));
      continue;
    }
    if (!job.title && !isDateFragment(line)) job.title = line;
    else if (!job.company && !isDateFragment(line)) job.company = line;
    else addDuties(line);
  }
  push();
  const a = jobs[0] || { company: "", title: "", dates: "", duties: [] };
  const b = jobs[1] || { company: "", title: "", dates: "", duties: [] };
  if (jobs.length > 2) {
    const extra = jobs.slice(2).map((item) => [item.dates, item.company, item.title].filter(Boolean).join(" ")).filter(Boolean);
    if (extra.length) b.duties.push("Earlier: " + extra.join("; "));
  }
  data.job1 = [a.company, a.title, a.dates];
  data.duty1 = pad(a.duties, 6);
  data.job2 = [b.company, b.title, b.dates];
  data.duty2 = pad(b.duties, 5);
}

function blank() {
  return {
    candidate: "",
    recruiter: "",
    date: today(),
    languages: "",
    skills: pad([], 7),
    recentSalary: "",
    expectedSalary: "",
    notice: "",
    eduLeft: "",
    edu: pad([], 4),
    certs: pad([], 2),
    project: pad([], 5),
    job1: ["", "", ""],
    duty1: pad([], 6),
    job2: ["", "", ""],
    duty2: pad([], 5)
  };
}

function esc(text) {
  return String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function sanitizeRich(html) {
  const root = document.createElement("div");
  root.innerHTML = String(html || "");
  const keep = { b: 1, strong: 1, i: 1, em: 1, ul: 1, ol: 1, li: 1, br: 1 };
  const walk = (node) => {
    [...node.childNodes].forEach((child) => {
      if (child.nodeType === 3) return;
      if (child.nodeType !== 1) { child.remove(); return; }
      const tag = child.tagName.toLowerCase();
      if (keep[tag]) {
        [...child.attributes].forEach((attr) => child.removeAttribute(attr.name));
        walk(child);
        return;
      }
      walk(child);
      if (tag === "div" || tag === "p") child.replaceWith(...child.childNodes, document.createElement("br"));
      else child.replaceWith(...child.childNodes);
    });
  };
  walk(root);
  return root.innerHTML.replace(/(?:<br>\s*)+$/gi, "");
}

function bulletHtml(html, plain) {
  const clean = sanitizeRich(html);
  if (/<li\b/i.test(clean)) return clean;
  const lines = String(plain || "").split(/\n/).map((line) => line.replace(/^[\s•\-\u2022]+/, "").trim()).filter(Boolean);
  const items = lines.length ? lines : [""];
  return "<ul>" + items.map((line) => "<li>" + (line ? esc(line) : "<br>") + "</li>").join("") + "</ul>";
}
function proseField(node) {

  if (host.matches("[data-field='duties'], .lines[data-field='text'], [data-slot='project']")) return host;
  return null;
}
function placeCaret(node) {
  const range = document.createRange();
  range.selectNodeContents(node);
  range.collapse(true);
  const sel = document.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
function ensureDutyList(host) {
  let list = host.querySelector("ul");
  if (list) return list;
  const lines = host.innerText.replace(/\u200b/g, "").split(/\n/).map((line) => line.replace(/^[\s•\-\u2022]+/, "").trim()).filter(Boolean);
  host.innerHTML = bulletHtml("", lines.join("\n"));
  return host.querySelector("ul");
}
function splitDuty(host) {
  const list = ensureDutyList(host);
  const sel = document.getSelection();
  const li = sel && sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement).closest("li");
  if (!li || !list.contains(li)) {
    const item = document.createElement("li");
    item.innerHTML = "<br>";
    list.appendChild(item);
    placeCaret(item);
    return;
  }
  const range = sel.getRangeAt(0);
  const rest = range.cloneRange();
  rest.selectNodeContents(li);
  rest.setStart(range.endContainer, range.endOffset);
  const tail = rest.extractContents();
  const next = document.createElement("li");
  if (!tail.textContent.trim()) next.innerHTML = "<br>";
  else next.appendChild(tail);
  if (!li.textContent.trim()) li.innerHTML = "<br>";
  li.after(next);
  placeCaret(next);
}
function richOrText(html, value) {
  const clean = sanitizeRich(html);
  if (/<(b|strong|i|em|ul|ol|li|br)\b/i.test(clean)) return clean;
  return esc(value || "");
}

function setPara(xml, id, text) {
  const token = 'w14:paraId="' + id + '"';
  const start = xml.indexOf(token);
  if (start < 0) return xml;
  const end = xml.indexOf("</w:p>", start);
  const slice = xml.slice(start, end);
  const safe = esc(text);
  const texts = [...slice.matchAll(/<w:t\b[^>]*>[\s\S]*?<\/w:t>/g)];
  let next;
  if (texts.length) {
    const last = texts[texts.length - 1];
    const filled = last[0].replace(/(<w:t\b[^>]*>)[\s\S]*?(<\/w:t>)/, "$1" + safe + "$2");
    next = slice.slice(0, last.index) + filled + slice.slice(last.index + last[0].length);
  } else {
    const fonts = (slice.match(/<w:rFonts[^>]*\/>/) || ['<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>'])[0];
    const sz = (slice.match(/<w:sz w:val="\d+"\/>/) || ['<w:sz w:val="40"/>'])[0];
    const szCs = (slice.match(/<w:szCs w:val="\d+"\/>/) || ['<w:szCs w:val="40"/>'])[0];
    next = slice + "<w:r><w:rPr>" + fonts + sz + szCs + '</w:rPr><w:t xml:space="preserve">' + safe + "</w:t></w:r>";
  }
  return xml.slice(0, start) + next + xml.slice(end);
}

function apply(xml, data) {
  const one = ["candidate", "recruiter", "date", "languages", "recentSalary", "expectedSalary", "notice", "eduLeft"];
  one.forEach((key) => { xml = setPara(xml, SLOTS[key], data[key]); });
  ["skills", "edu", "certs", "project", "job1", "duty1", "job2", "duty2"].forEach((key) => {
    SLOTS[key].forEach((id, index) => { xml = setPara(xml, id, (data[key] && data[key][index]) || ""); });
  });
  return dropRemoved(xml, data.removed || []);
}

function cutElementContaining(xml, tag, id, alsoEmptyP) {
  const at = xml.indexOf('w14:paraId="' + id + '"');
  if (at < 0) return xml;
  const openRe = new RegExp("<w:" + tag + "(?=[\\s>])", "g");
  let start = -1;
  let mark;
  while ((mark = openRe.exec(xml))) {
    if (mark.index > at) break;
    start = mark.index;
  }
  if (start < 0) return xml;
  const close = "</w:" + tag + ">";
  openRe.lastIndex = start;
  let depth = 0;
  let i = start;
  while (i < xml.length) {
    openRe.lastIndex = i;
    const nextOpen = openRe.exec(xml);
    const nextClose = xml.indexOf(close, i);
    if (nextClose < 0) return xml;
    if (nextOpen && nextOpen.index < nextClose) {
      depth += 1;
      i = nextOpen.index + nextOpen[0].length;
    } else {
      depth -= 1;
      i = nextClose + close.length;
      if (depth === 0) {
        let next = xml.slice(0, start) + xml.slice(i);
        if (alsoEmptyP) {
          const rest = next.slice(start);
          const self = rest.match(/^<w:p\b[^>]*\/>/);
          const pair = rest.match(/^<w:p\b[\s\S]*?<\/w:p>/);
          const hit = self || (pair && !pair[0].includes("<w:t") ? pair : null);
          if (hit) next = next.slice(0, start) + rest.slice(hit[0].length);
        }
        return next;
      }
    }
  }
  return xml;
}

function dropRemoved(xml, removed) {
  const gone = new Set(removed || []);
  [["edu", "077984BF"], ["certs", "6A838ABA"], ["project", "4445BF81"]].forEach(([key, id]) => {
    if (gone.has(key)) xml = cutElementContaining(xml, "tbl", id, true);
  });
  if (gone.has("job1") && gone.has("job2")) xml = cutElementContaining(xml, "tbl", "703ABBDA", true);
  else {
    if (gone.has("job1")) xml = cutElementContaining(xml, "tr", "6536531E", false);
    if (gone.has("job2")) xml = cutElementContaining(xml, "tr", "202F88F4", false);
  }
  return xml;
}

async function toDocx(data) {
  const res = await fetch("cv/template.docx?v=42");

  const xml = fflate.strFromU8(files["word/document.xml"]);
  files["word/document.xml"] = fflate.strToU8(apply(xml, data));

function saveFile(bytes, name, type) {
  const blob = new Blob([bytes], { type: type || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

async function captureSheets(root) {
  const host = root || document.getElementById("sheet-wrap");
  const sheets = [...host.querySelectorAll(".sheet")];
  const blanks = [...host.querySelectorAll("[contenteditable='true']")].filter((node) => !node.textContent.trim());
  blanks.forEach((node) => { node.textContent = "\u200b"; });
  const pages = [];
  try {
    for (const sheet of sheets) {
      const canvas = await html2canvas(sheet, {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true,
        logging: false,
        onclone(doc) {
          const hidden = doc.getElementById("export-root");
          if (hidden) { hidden.style.opacity = "1"; hidden.style.zIndex = "1"; }
          doc.querySelectorAll(".col-x, .add-row").forEach((node) => node.remove());
          doc.querySelectorAll(".cover-drag").forEach((node) => { node.style.outline = "none"; });
        }
      });
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.92));
      pages.push({
        bytes: new Uint8Array(await blob.arrayBuffer()),
        width: canvas.width,
        height: canvas.height
      });
    }
  } finally {
    blanks.forEach((node) => { node.textContent = ""; });
  }
  return pages;
}

function pdfFromPages(pages) {
  const parts = [];
  const offsets = [];
  let size = 0;
  const asBytes = (data) => typeof data === "string" ? fflate.strToU8(data) : data;
  function add(data) {
    const bytes = asBytes(data);
    parts.push(bytes);
    size += bytes.length;
  }
  add("%PDF-1.4\n");
  const ids = pages.map((_, index) => ({
    page: 3 + index * 3,
    content: 4 + index * 3,
    image: 5 + index * 3
  }));
  function obj(body) {
    offsets.push(size);
    add(body);
  }
  obj("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  obj("2 0 obj\n<< /Type /Pages /Count " + pages.length + " /Kids [" + ids.map((id) => id.page + " 0 R").join(" ") + "] >>\nendobj\n");
  pages.forEach((page, index) => {
    const id = ids[index];
    const content = "q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n";
    obj(id.page + " 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Contents " + id.content + " 0 R /Resources << /XObject << /Im0 " + id.image + " 0 R >> >> >>\nendobj\n");
    obj(id.content + " 0 obj\n<< /Length " + asBytes(content).length + " >>\nstream\n" + content + "endstream\nendobj\n");
    offsets.push(size);
    add(id.image + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + page.width + " /Height " + page.height + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + page.bytes.length + " >>\nstream\n");
    add(page.bytes);
    add("\nendstream\nendobj\n");
  });
  const xref = size;
  let table = "xref\n0 " + (offsets.length + 1) + "\n0000000000 65535 f \n";
  offsets.forEach((offset) => { table += String(offset).padStart(10, "0") + " 00000 n \n"; });
  add(table);
  add("trailer\n<< /Size " + (offsets.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF");
  const out = new Uint8Array(size);
  let at = 0;
  parts.forEach((part) => { out.set(part, at); at += part.length; });
  return out;
}

  };
  pages.forEach((page, index) => { files["word/media/page" + (index + 1) + ".jpg"] = page.bytes; });

}

async function exportData(data, kind) {
  const root = document.getElementById("export-root");
  renderInto(root, data, false);
  try {
    const pages = await captureSheets(root);
    const name = cleanFileName(data.fileName, data.candidate ? "HR Plus CV - " + data.candidate : "HR Plus CV");
    if (kind === "pdf") saveFile(pdfFromPages(pages), name + ".pdf", "application/pdf");
    else saveFile(docxFromPages(pages), name + ".docx", "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  } finally {
    root.innerHTML = "";
  }
}

async function downloadPages(kind) {
  const status = document.getElementById("status");
  if (!document.querySelector("#sheet-wrap .sheet")) {
    status.textContent = "Open a CV first.";
    return;
  }
  const data = readSheet();
  data.fileName = chosenFileName(data);
  status.textContent = "Preparing the file…";
  try {
    await exportData(data, kind);
    status.textContent = "Downloaded.";
  } catch (error) {
    status.textContent = "The file could not be prepared.";
  }
}

}

function coverLine(label, slot, value, placeholder) {

function addBtn(act, label) {
  return `<button type="button" class="add-btn" data-add-act="${esc(act)}">${esc(label)}</button>`;
}

function linesOf(list) {
  return (list || []).map((item) => String(item || "").trim()).filter(Boolean);
}

function entriesFrom(data) {
  const saved = data.more;
  if (saved && saved.edu && saved.certs && saved.jobs) {
    return { edu: saved.edu, certs: saved.certs, jobs: saved.jobs, boxes: saved.boxes || [] };
  }
  const edu = [{ year: data.eduLeft || "", school: linesOf(data.edu).join("\n") }];
  const certs = linesOf(data.certs);
  const job = (pair, duties) => ({
    company: (pair && pair[0]) || "",
    role: (pair && pair[1]) || "",
    dates: (pair && pair[2]) || "",
    duties: linesOf(duties).join("\n"),
  });
  const jobs = [job(data.job1, data.duty1)];
  const second = job(data.job2, data.duty2);
  if (second.company || second.role || second.dates || second.duties) jobs.push(second);
  return { edu: edu, certs: certs, jobs: jobs, boxes: [] };
}

      <table class="block">
        <tr><td class="h project">Recent Project</td></tr>
        <tr><td>${field("lines", "project", project, "Project", data.rich && data.rich.project)}</td></tr>
      </table>
      <table class="block"${id("work")}>
        <tr><td class="h work">Work Experience</td></tr>
        <tr><td>${more.jobs.map(jobBlock).join("")}<div class="add-row">${addBtn("job", "+ Add job")}</div></td></tr>
      </table>
      <div class="extras"${id("extras")}>${(more.boxes || []).map(boxBlock).join("")}</div>
      <div class="add-row section-add">${addBtn("box", "+ Add a box")}</div>
      ${foot}
    </article>`;
}

function renderInto(root, data, live) {
  root.innerHTML = sheetMarkup(data, live);
  const photoNode = root.querySelector(".photo");
  if (photoNode && data.photo) photoNode.src = data.photo;
  paginateSheets(root);
  if (!live) return;
  document.getElementById("sheet-wrap").hidden = false;
  document.getElementById("save-bar").hidden = false;
  const photoLabel = document.getElementById("photo-add-label");
  const photoClear = document.getElementById("photo-clear");
  if (photoLabel) photoLabel.textContent = data.photo ? "Change Photo" : "+ Candidate Photo";
  if (photoClear) photoClear.hidden = !data.photo;
  root.querySelectorAll("[data-remove-entry]").forEach((button) => {
    button.onclick = () => {
      const entry = button.closest("[data-entry]");
      if (entry) entry.remove();
      sheetDirty = true;
      render(readSheet());
    };
  });
  root.querySelectorAll("[data-add-act]").forEach((button) => {
    button.onclick = () => runAdd(button.dataset.addAct);
  });
  const fresh = root.querySelector("[data-new]");
  if (fresh) fresh.focus();
}

function render(data) {
  renderInto(document.getElementById("sheet-wrap"), data, true);
}

function sheetChromeHeight(sheet) {
  const style = getComputedStyle(sheet);
  const head = sheet.querySelector(".head");
  return parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) + (head ? head.offsetHeight : 0);
}

function blockHeight(el) {
  const style = getComputedStyle(el);
  return el.offsetHeight + parseFloat(style.marginTop) + parseFloat(style.marginBottom);
}

function continuationSheet(mark, head, foot) {
  const page = document.createElement("article");
  page.className = "sheet";
  page.appendChild(mark.cloneNode(true));
  page.appendChild(head.cloneNode(true));
  page.appendChild(foot.cloneNode(true));
  return page;
}

function paginateSheets(root) {
  const sheet = root.querySelector(".sheet:not(.cover)");
  if (!sheet) return;
  const add = sheet.querySelector(".section-add");
  const budget = 1123 - sheetChromeHeight(sheet) - (add ? blockHeight(add) : 0);
  const kids = [...sheet.children];
  const atoms = [];
  kids.forEach((el) => {
    if (el.matches(".mark, .head, .foot") || el === add) return;
    if (el.classList.contains("extras")) {
      [...el.children].forEach((box) => atoms.push(...fitBlock(box, budget, sheet)));
      el.remove();
      return;
    }
    atoms.push(...fitBlock(el, budget, sheet));
  });
  const groups = [];
  let current = [];
  let used = 0;
  atoms.forEach((el) => {
    const height = blockHeight(el);
    if (current.length && used + height > budget) {
      groups.push(current);
      current = [];
      used = 0;
    }
    current.push(el);
    used += height;
  });
  if (current.length) groups.push(current);
  const mark = sheet.querySelector(".mark");
  const head = sheet.querySelector(".head");
  const foot = sheet.querySelector(".foot");
  groups.forEach((group, index) => {
    const page = index === 0 ? sheet : continuationSheet(mark, head, foot);
    if (index > 0) root.appendChild(page);
    const anchor = page.querySelector(".foot");
    group.forEach((el) => page.insertBefore(el, anchor));
  });
  const last = root.querySelector("article.sheet:last-of-type");
  if (add && last && !last.classList.contains("cover")) last.insertBefore(add, last.querySelector(".foot"));
}

function fitBlock(el, budget, sheet) {
  if (blockHeight(el) <= budget) return [el];
  if (el.querySelector(".job")) return fitJobs(el, budget, sheet);
  if (el.querySelector(".h.cert")) return fitLines(el, budget, sheet);
  if (el.querySelector("[data-field='year']") || el.id === "profile") return fitRows(el, budget, sheet);
  if (el.querySelector("[data-slot='project'], [data-field='text'], [data-field='duties']")) return fitText(el, budget, sheet);
  return [el];
}

function fitRows(table, budget, sheet) {
  if (blockHeight(table) <= budget) return [table];
  const header = table.rows[0] && table.rows[0].querySelector(".h") ? table.rows[0] : null;
  const minRows = header ? 2 : 1;
  const pieces = [table];
  let current = table;
  while (blockHeight(current) > budget && current.rows.length > minRows) {
    const next = current.cloneNode(false);
    next.removeAttribute("id");
    if (header) next.appendChild(header.cloneNode(true));
    const overflow = [];
    while (blockHeight(current) > budget && current.rows.length > minRows) {
      const addRow = current.rows[current.rows.length - 1].querySelector(".add-row");
      if (addRow && current.rows.length > minRows + 1) {
        overflow.unshift(current.rows[current.rows.length - 1]);
        current.deleteRow(current.rows.length - 1);
        continue;
      }
      overflow.unshift(current.rows[current.rows.length - 1]);
      current.deleteRow(current.rows.length - 1);
    }
    overflow.forEach((row) => next.appendChild(row));
    sheet.insertBefore(next, current.nextSibling);
    pieces.push(next);
    current = next;
  }
  return pieces;
}

function fitLines(table, budget, sheet) {
  if (blockHeight(table) <= budget) return [table];
  const cell = table.querySelector("td:not(.h)") || table;
  const lines = [...cell.querySelectorAll(":scope > .line-row")];
  const pieces = [table];
  let current = table;
  let guard = 0;
  while (blockHeight(current) > budget && lines.length > 1 && guard < 20) {
    guard += 1;
    const next = current.cloneNode(true);
    next.removeAttribute("id");
    const nextCell = next.querySelector("td:not(.h)") || next;
    nextCell.querySelectorAll(".line-row, .add-row").forEach((node) => node.remove());
    const keep = Math.max(1, Math.ceil(lines.length / 2));
    const moved = lines.splice(keep);
    const live = [...current.querySelectorAll(".line-row")];
    live.forEach((row, index) => { if (index >= keep) row.remove(); });
    moved.forEach((row) => nextCell.appendChild(row));
    const addRow = current.querySelector(".add-row");
    if (addRow) nextCell.appendChild(addRow);
    sheet.insertBefore(next, current.nextSibling);
    pieces.push(next);
    current = next;
    lines.length = 0;
    lines.push(...current.querySelectorAll(".line-row"));
  }
  return pieces;
}

function fitJobs(table, budget, sheet) {
  const header = table.rows[0];
  const jobs = [...table.querySelectorAll(".job")];
  if (jobs.length < 2 && blockHeight(table) <= budget) return [table];
  if (jobs.length < 2) return fitText(table, budget, sheet);
  const pieces = [];
  jobs.forEach((job) => {
    const wrap = table.cloneNode(false);
    wrap.removeAttribute("id");
    wrap.appendChild(header.cloneNode(true));
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    tr.appendChild(td);
    td.appendChild(job);
    wrap.appendChild(tr);
    sheet.insertBefore(wrap, table);
    pieces.push(...(blockHeight(wrap) > budget ? fitText(wrap, budget, sheet) : [wrap]));
  });
  const addRow = table.querySelector(".add-row");
  table.remove();
  if (addRow && pieces.length) {
    const cells = pieces[pieces.length - 1].querySelectorAll("td");
    cells[cells.length - 1].appendChild(addRow);
  }
  return pieces;
}

function htmlUnits(html) {
  const holder = document.createElement("div");
  holder.innerHTML = html || "";
  const units = [];
  [...holder.childNodes].forEach((node) => {
    if (node.nodeType === 3) {
      node.textContent.split(/\n/).forEach((line) => {
        if (line.trim()) units.push(document.createTextNode(line.trim()));
      });
      return;
    }
    if (!node.tagName || /^BR$/i.test(node.tagName)) return;
    if (/^(UL|OL)$/i.test(node.tagName)) {
      [...node.children].forEach((li) => {
        const list = document.createElement(node.tagName.toLowerCase());
        list.appendChild(li.cloneNode(true));
        units.push(list);
      });
      return;
    }
    units.push(node.cloneNode(true));
  });
  return units;
}

function fitText(el, budget, sheet) {
  if (blockHeight(el) <= budget) return [el];
  const field = el.querySelector("[data-field='duties'], [data-field='text'], [data-slot='project']");
  if (!field) return [el];
  const units = htmlUnits(field.innerHTML);
  if (units.length < 2) return [el];
  field.innerHTML = "";
  const pieces = [el];
  let current = el;
  let index = 0;
  const place = (target, start) => {
    const box = target.querySelector("[data-field='duties'], [data-field='text'], [data-slot='project']");
    let at = start;
    while (at < units.length) {
      if (box.childNodes.length && units[at].nodeType === 3) box.appendChild(document.createElement("br"));
      box.appendChild(units[at]);
      if (blockHeight(target) > budget && box.childNodes.length > 1) {
        box.removeChild(units[at]);
        break;
      }
      at += 1;
      if (blockHeight(target) > budget) break;
    }
    return at;
  };
  index = place(current, 0);
  while (index < units.length) {
    const next = current.cloneNode(true);
    next.removeAttribute("id");
    next.setAttribute("data-part", "continue");
    const job = next.querySelector(".job");
    if (job) job.setAttribute("data-part", "continue");
    next.querySelectorAll("[data-field='company'], [data-field='role'], [data-field='dates'], [data-field='title']").forEach((node) => {
      const row = node.closest(".line-row") || node;
      if (row !== next) row.remove();
    });
    const box = next.querySelector("[data-field='duties'], [data-field='text'], [data-slot='project']");
    box.innerHTML = "";
    sheet.insertBefore(next, current.nextSibling);
    current = next;
    pieces.push(current);
    const nextIndex = place(current, index);
    if (nextIndex === index) break;
    index = nextIndex;
  }
  return pieces;
}

function columnText(node) {
  return node ? node.innerText.replace(/\u00a0/g, " ").replace(/\n+$/g, "").trim() : "";
}

function textOf(slot) {
  const nodes = slot === "candidate" || slot === "recruiter" || slot === "date"
    ? document.querySelectorAll('.sheet.cover [data-slot="' + slot + '"]')
    : document.querySelectorAll('#sheet-wrap .sheet:not(.cover) [data-slot="' + slot + '"]');
  return [...nodes].map((node) => node.innerText.replace(/\u00a0/g, " ").trim()).filter(Boolean).join("\n");
}

function splitSlot(slot, n) {
  const lines = textOf(slot).split(/\n/).map((line) => line.trim()).filter(Boolean);
  return pad(lines, n);
}

function fieldText(row, name) {
  return columnText(row.querySelector('[data-field="' + name + '"]'));
}

function fieldHtml(row, name) {
  const node = row.querySelector('[data-field="' + name + '"]');
  return node ? sanitizeRich(node.innerHTML) : "";
}

function slotHtml(slot) {
  const nodes = document.querySelectorAll('#sheet-wrap .sheet:not(.cover) [data-slot="' + slot + '"]');
  return [...nodes].map((node) => sanitizeRich(node.innerHTML)).join("");
}

function readSheet() {
  const data = blank();
  ["candidate", "recruiter", "date", "languages", "recentSalary", "expectedSalary", "notice"].forEach((key) => {
    data[key] = textOf(key);
  });
  data.rich = {
    languages: slotHtml("languages"),
    skills: slotHtml("skills"),
    recentSalary: slotHtml("recentSalary"),
    expectedSalary: slotHtml("expectedSalary"),
    notice: slotHtml("notice"),
    project: slotHtml("project"),
    certs: []
  };
  data.skills = pad(textOf("skills").split(/\n/).map((line) => line.trim()).filter(Boolean), 7);
  data.project = pad(textOf("project").split(/\n/).map((line) => line.trim()).filter(Boolean), 5);
  const edu = Array.from(document.querySelectorAll("#sheet-wrap .sheet:not(.cover) tr[data-entry]")).filter((row) => row.querySelector("[data-field='year']")).map((row) => ({
    year: fieldText(row, "year"),
    school: fieldText(row, "school"),
    yearHtml: fieldHtml(row, "year"),
    schoolHtml: fieldHtml(row, "school")
  }));
  const certRows = Array.from(document.querySelectorAll("#sheet-wrap .sheet:not(.cover) .line-row[data-entry]")).filter((row) => {
    const table = row.closest("table");
    return table && table.querySelector(".h.cert");
  });
  const certs = certRows.map((row) => fieldText(row, "text"));
  data.rich.certs = certRows.map((row) => fieldHtml(row, "text"));
  const jobs = [];
  Array.from(document.querySelectorAll("#sheet-wrap .sheet:not(.cover) .job")).forEach((row) => {
    if (row.getAttribute("data-part") === "continue" && jobs.length) {
      const prev = jobs[jobs.length - 1];
      const extra = fieldText(row, "duties");
      const extraHtml = fieldHtml(row, "duties");
      prev.duties = [prev.duties, extra].filter(Boolean).join("\n");
      prev.dutiesHtml = (prev.dutiesHtml || "") + (extraHtml || "");
      return;
    }
    jobs.push({
      company: fieldText(row, "company"),
      role: fieldText(row, "role"),
      dates: fieldText(row, "dates"),
      duties: fieldText(row, "duties"),
      companyHtml: fieldHtml(row, "company"),
      roleHtml: fieldHtml(row, "role"),
      datesHtml: fieldHtml(row, "dates"),
      dutiesHtml: fieldHtml(row, "duties")
    });
  });
  const boxes = [];
  Array.from(document.querySelectorAll("#sheet-wrap [data-box]")).forEach((row) => {
    if (row.getAttribute("data-part") === "continue" && boxes.length) {
      const prev = boxes[boxes.length - 1];
      prev.text = [prev.text, fieldText(row, "text")].filter(Boolean).join("\n");
      prev.textHtml = (prev.textHtml || "") + (fieldHtml(row, "text") || "");
      return;
    }
    boxes.push({
      title: fieldText(row, "title"),
      text: fieldText(row, "text"),
      titleHtml: fieldHtml(row, "title"),
      textHtml: fieldHtml(row, "text"),
      color: boxColor(row.querySelector("[data-color]") && row.querySelector("[data-color]").getAttribute("data-color"), boxes.length),
    });
  });
  data.more = { edu: edu, certs: certs, jobs: jobs, boxes: boxes };
  const photoNode = document.querySelector("#sheet .photo");
  data.photo = photoNode && photoNode.getAttribute("src") ? photoNode.getAttribute("src") : "";
  data.sample = editingSample;
  data.eduLeft = edu[0] ? edu[0].year : "";
  data.edu = packLines(edu.flatMap((row, index) => {
    const schools = String(row.school || "").split(/\n/).map((line) => line.trim()).filter(Boolean);
    if (index === 0) return schools;
    const head = [row.year, schools[0]].filter(Boolean).join(" — ");
    return [head].concat(schools.slice(1)).filter(Boolean);
  }), 4);
  data.certs = packLines(certs, 2);
  const first = jobs[0] || {};
  const second = jobs[1] || {};
  const extra = jobs.slice(2).flatMap((job) => {
    const head = [job.company, job.role, job.dates].filter(Boolean).join(" — ");
    const duties = String(job.duties || "").split(/\n/).map((line) => line.trim()).filter(Boolean);
    return [head].concat(duties).filter(Boolean);
  });
  data.job1 = [first.company || "", first.role || "", first.dates || ""];
  data.job2 = [second.company || "", second.role || "", second.dates || ""];
  data.duty1 = pad(String(first.duties || "").split(/\n/).map((line) => line.trim()).filter(Boolean), 6);
  data.duty2 = packLines(String(second.duties || "").split(/\n/).map((line) => line.trim()).filter(Boolean).concat(extra), 5);
  data.removed = [];
  return data;
}

function packLines(lines, n) {
  const clean = lines.map((line) => String(line || "").trim()).filter(Boolean);
  if (clean.length <= n) return pad(clean, n);
  return pad(clean.slice(0, n - 1).concat([clean.slice(n - 1).join("\n")]), n);
}

function runAdd(act) {
  const data = readSheet();
  if (act === "edu") {
    data.more.edu.push({ year: "", school: "", fresh: true });
    document.getElementById("status").textContent = "Type the education.";
  } else if (act === "cert") {
    data.more.certs.push("");
    data.more.certFresh = true;
    document.getElementById("status").textContent = "Type the certificate.";
  } else if (act === "job") {
    data.more.jobs.push({ company: "", role: "", dates: "", duties: "", fresh: true });
    document.getElementById("status").textContent = "Type the company.";
  } else if (act === "box") {
    data.more.boxes = data.more.boxes || [];
    const previous = data.more.boxes.length ? data.more.boxes[data.more.boxes.length - 1].color : "";
    let color = BOX_COLORS[data.more.boxes.length % BOX_COLORS.length];
    if (color === previous) color = BOX_COLORS[(data.more.boxes.length + 1) % BOX_COLORS.length];
    data.more.boxes.push({ title: "", text: "", color: color, fresh: true });
    document.getElementById("status").textContent = "";
  } else return;
  render(data);
}

function loadAll() {
  try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
  catch (e) { return []; }
}

function storeAll(rows) {
  try {
    localStorage.setItem(KEY, JSON.stringify(rows));
  } catch (error) {
    window.alert("Local storage full. Please export or clear old CVs.");
    throw error;
  }
}

function pushCv(row) {
  fetch("/api/cv-record", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(row)
  }).catch(() => {});
}

async function pullCvs() {
  try {
    const response = await fetch("/api/cv-record", { credentials: "same-origin" });
    if (!response.ok) return;
    const payload = await response.json().catch(() => ({}));
    const remote = Array.isArray(payload.cvs) ? payload.cvs : [];
    const local = loadAll();
    const byId = new Map();
    remote.forEach((row) => { if (row && row.id) byId.set(row.id, row); });
    const missing = [];
    local.forEach((row) => {
      if (row && row.id && !byId.has(row.id)) {
        byId.set(row.id, row);
        missing.push(row);
      }
    });
    const merged = [...byId.values()];
    try { localStorage.setItem(KEY, JSON.stringify(merged)); }
    catch (error) { window.alert("Local storage full. Please export or clear old CVs."); }
    missing.forEach(pushCv);
  } catch (error) {}
}

function cleanFileName(value, fallback) {
  const name = String(value || "").trim().replace(/\.docx$/i, "").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
  return name || fallback || "HR Plus CV";
}

function chosenFileName(data) {
  const fallback = data && data.candidate ? "HR Plus CV - " + data.candidate : "HR Plus CV";
  const input = document.getElementById("file-name");
  return cleanFileName(input ? input.value : "", fallback);
}

function pack(data, fileName, id) {
  const name = cleanFileName(fileName, data.candidate ? "HR Plus CV - " + data.candidate : "HR Plus CV");
  return Object.assign({ id: id || String(Date.now()) + Math.random().toString(16).slice(2), fileName: name }, data);
}
